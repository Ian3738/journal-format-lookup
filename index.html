<title>國內外期刊投稿格式平台</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap">

<style>
/* ============ tokens ============ */
:root{
  --ink:#16202e; --ink-2:#38455a; --ink-3:#5d6b81; --ink-4:#8593a8;
  --ground:#f7f8fa; --surface:#ffffff; --surface-2:#eef1f6; --surface-3:#e3e8f0;
  --line:#d8dfe9; --line-strong:#b9c4d4;
  --indigo:#29457a; --indigo-soft:#dde5f4; --indigo-text:#29457a;
  --vermilion:#b33a2b; --vermilion-soft:#f8e2de; --vermilion-text:#96301f;
  --violet:#5b4b8a; --violet-soft:#e8e3f4; --violet-text:#4c3d79;
  --amber:#b77f2e; --amber-soft:#f8ecd8; --amber-text:#8f6118;
  --green:#3f7a52; --green-soft:#dff0e4; --green-text:#2e6540;
  --shadow:0 1px 2px rgba(22,32,46,.06),0 8px 24px -12px rgba(22,32,46,.18);
  --shadow-lg:0 2px 6px rgba(22,32,46,.08),0 24px 56px -20px rgba(22,32,46,.3);
  --sans:"IBM Plex Sans TC","IBM Plex Sans","Helvetica Neue",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC",Georgia,serif;
  --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e5eaf2; --ink-2:#b9c4d4; --ink-3:#8d9bb0; --ink-4:#6b7a90;
    --ground:#0e141d; --surface:#161e2a; --surface-2:#1e2836; --surface-3:#273343;
    --line:#2b3747; --line-strong:#3d4c60;
    --indigo:#8fb0e6; --indigo-soft:#1d2c47; --indigo-text:#a6c1ef;
    --vermilion:#e8836f; --vermilion-soft:#3a2019; --vermilion-text:#f0977f;
    --violet:#a698d8; --violet-soft:#272141; --violet-text:#b5a8e2;
    --amber:#dfa958; --amber-soft:#33280f; --amber-text:#e6b96f;
    --green:#7ec293; --green-soft:#16301f; --green-text:#8fd0a4;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 56px -20px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --ink:#e5eaf2; --ink-2:#b9c4d4; --ink-3:#8d9bb0; --ink-4:#6b7a90;
  --ground:#0e141d; --surface:#161e2a; --surface-2:#1e2836; --surface-3:#273343;
  --line:#2b3747; --line-strong:#3d4c60;
  --indigo:#8fb0e6; --indigo-soft:#1d2c47; --indigo-text:#a6c1ef;
  --vermilion:#e8836f; --vermilion-soft:#3a2019; --vermilion-text:#f0977f;
  --violet:#a698d8; --violet-soft:#272141; --violet-text:#b5a8e2;
  --amber:#dfa958; --amber-soft:#33280f; --amber-text:#e6b96f;
  --green:#7ec293; --green-soft:#16301f; --green-text:#8fd0a4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 56px -20px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:600; line-height:1.3}
a{color:var(--indigo-text)}
button{font-family:inherit; font-size:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--indigo); outline-offset:2px; border-radius:4px}

/* ============ shell ============ */
.top{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1560px; margin:0 auto; padding:14px 22px; display:flex; flex-wrap:wrap; gap:16px; align-items:center}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto; border:0; background:none; padding:0; color:inherit; border-radius:6px}
.brand:hover h1{color:var(--indigo-text)}
.brand h1{font-family:var(--serif); font-size:20px; letter-spacing:.01em}
.brand .sub{font-size:12px; color:var(--ink-4); font-family:var(--mono); letter-spacing:.02em}

.search{position:relative; flex:1 1 320px; max-width:460px}
.search input{
  width:100%; padding:9px 34px 9px 34px; font-family:inherit; font-size:14px;
  background:var(--surface-2); color:var(--ink);
  border:1px solid var(--line); border-radius:var(--r);
}
.search input::placeholder{color:var(--ink-4)}
.search .ico{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-4); pointer-events:none; font-size:13px}
.search .clr{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; color:var(--ink-4); padding:4px 7px; font-size:15px; line-height:1; border-radius:6px}
.search .clr:hover{color:var(--ink); background:var(--surface-3)}

.tabs{display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:var(--r); border:1px solid var(--line)}
.tabs button{
  border:0; background:none; color:var(--ink-3); padding:6px 13px;
  border-radius:7px; font-size:13.5px; font-weight:500; white-space:nowrap;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow); font-weight:600}

.icon-btn{
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
  width:36px; height:36px; border-radius:var(--r); display:grid; place-items:center; font-size:15px;
}
.icon-btn:hover{background:var(--surface-3); color:var(--ink)}

/* ============ layout ============ */
.wrap{max-width:1560px; margin:0 auto; padding:22px; display:grid; grid-template-columns:238px minmax(0,1fr); gap:26px; align-items:start}
.wrap.solo{grid-template-columns:minmax(0,1fr)}

aside{position:sticky; top:78px; display:flex; flex-direction:column; gap:20px; max-height:calc(100vh - 100px); overflow-y:auto; padding-right:4px}
.fgroup h3{
  font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-4);
  font-weight:600; margin-bottom:9px; font-family:var(--mono);
}
.fopts{display:flex; flex-direction:column; gap:1px}
.fopt{
  display:flex; align-items:center; gap:8px; padding:5px 9px; border-radius:7px;
  font-size:13.5px; color:var(--ink-2); border:0; background:none; text-align:left; width:100%;
}
.fopt:hover{background:var(--surface-2); color:var(--ink)}
.fopt[aria-pressed="true"]{background:var(--indigo-soft); color:var(--indigo-text); font-weight:600}
.fopt .n{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-4); font-variant-numeric:tabular-nums}
.fopt[aria-pressed="true"] .n{color:var(--indigo-text)}
.dot{width:8px; height:8px; border-radius:2px; flex:none}

.reset{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-3);
  padding:7px 12px; border-radius:var(--r); font-size:13px; width:100%;
}
.reset:hover{border-color:var(--line-strong); color:var(--ink)}

/* ============ results ============ */
.rhead{display:flex; align-items:baseline; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.rcount{font-family:var(--mono); font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.rhead .hint{font-size:12.5px; color:var(--ink-4); margin-left:auto}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 16px 13px; display:flex; flex-direction:column; gap:11px;
  text-align:left; width:100%; font:inherit; color:inherit;
  transition:border-color .12s, box-shadow .12s, transform .12s;
}
.card:hover{border-color:var(--line-strong); box-shadow:var(--shadow); transform:translateY(-1px)}
.card.picked{border-color:var(--indigo); box-shadow:0 0 0 1px var(--indigo)}

.badges{display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.badge{
  font-size:11px; font-weight:600; padding:2.5px 7px; border-radius:5px;
  font-family:var(--mono); letter-spacing:.01em; white-space:nowrap;
}
.b-t1{background:var(--vermilion-soft); color:var(--vermilion-text)}
.b-t2{background:var(--amber-soft); color:var(--amber-text)}
.b-t3{background:var(--surface-3); color:var(--ink-3)}
.b-q1{background:var(--violet-soft); color:var(--violet-text)}
.b-q2{background:var(--indigo-soft); color:var(--indigo-text)}
.b-oa{background:var(--green-soft); color:var(--green-text)}
.b-free{background:var(--green-soft); color:var(--green-text)}

.cname{font-family:var(--serif); font-size:17.5px; font-weight:600; line-height:1.35; letter-spacing:.01em}
.cname-en{font-size:12px; color:var(--ink-4); line-height:1.45; margin-top:3px; font-style:italic}
.cpub{font-size:12px; color:var(--ink-3)}

.facts{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12.5px; margin-top:1px}
.facts dt{color:var(--ink-4); white-space:nowrap}
.facts dd{margin:0; color:var(--ink-2); font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums}
.facts dd.q{color:var(--ink-4); font-style:italic; font-family:var(--sans)}

.cfoot{display:flex; align-items:center; gap:8px; margin-top:2px; padding-top:9px; border-top:1px solid var(--line)}
.vstat{font-size:11px; font-family:var(--mono); display:flex; align-items:center; gap:5px}
.v-official{color:var(--green-text)}
.v-partial{color:var(--amber-text)}
.v-listed{color:var(--ink-4)}
.pickbtn{
  margin-left:auto; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-3);
  font-size:11.5px; padding:3px 9px; border-radius:6px; font-family:var(--mono);
}
.pickbtn:hover{border-color:var(--line-strong); color:var(--ink)}
.pickbtn[aria-pressed="true"]{background:var(--indigo); border-color:var(--indigo); color:#fff}
:root[data-theme="dark"] .pickbtn[aria-pressed="true"], :root:not([data-theme="light"]) .pickbtn[aria-pressed="true"]{color:var(--ground)}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .pickbtn[aria-pressed="true"]{color:#fff} }

.empty{padding:60px 20px; text-align:center; color:var(--ink-4)}
.empty strong{display:block; color:var(--ink-2); font-size:16px; margin-bottom:6px; font-family:var(--serif)}

/* ============ drawer ============ */
.scrim{position:fixed; inset:0; background:rgba(14,20,29,.42); z-index:50; opacity:0; pointer-events:none; transition:opacity .18s}
.scrim.on{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(660px,100%); z-index:51;
  background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow-lg);
  transform:translateX(100%); transition:transform .22s cubic-bezier(.32,.72,0,1);
  display:flex; flex-direction:column;
}
.drawer.on{transform:none}
@media(prefers-reduced-motion:reduce){ .drawer,.scrim{transition:none} }
.dhead{padding:20px 24px 15px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:flex-start}
.dhead .x{border:0; background:var(--surface-2); color:var(--ink-3); width:30px; height:30px; border-radius:7px; flex:none; font-size:16px; line-height:1}
.dhead .x:hover{background:var(--surface-3); color:var(--ink)}
.dbody{padding:20px 24px 40px; overflow-y:auto; flex:1}

.sect{margin-bottom:24px}
.sect > h4{
  font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-4);
  font-family:var(--mono); font-weight:600; margin-bottom:10px;
  padding-bottom:6px; border-bottom:1px solid var(--line);
}
.rows{display:grid; grid-template-columns:118px minmax(0,1fr); gap:9px 16px; font-size:13.5px}
.rows dt{color:var(--ink-4); font-size:12.5px; padding-top:1px}
.rows dd{margin:0; color:var(--ink); line-height:1.6}
.rows dd .num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:500}
.rows dd small{display:block; color:var(--ink-3); font-size:12px; margin-top:2px; line-height:1.55}

.note{
  background:var(--amber-soft); border-left:2.5px solid var(--amber);
  padding:10px 13px; border-radius:0 7px 7px 0; font-size:13px; color:var(--ink-2); line-height:1.6;
}
.note + .note{margin-top:8px}
.note b{color:var(--amber-text)}

.linkrow{display:flex; flex-wrap:wrap; gap:8px}
.linkbtn{
  display:inline-flex; align-items:center; gap:6px; text-decoration:none;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
  padding:7px 12px; border-radius:8px; font-size:13px;
}
.linkbtn:hover{border-color:var(--line-strong); color:var(--ink); background:var(--surface-3)}
.linkbtn .ar{color:var(--ink-4); font-size:11px}

.srcbox{font-size:12px; color:var(--ink-3); line-height:1.6; background:var(--surface-2); padding:11px 13px; border-radius:8px}
.srcbox code{font-family:var(--mono); font-size:11.5px; color:var(--ink-2)}

/* ============ compare ============ */
/* 顯示與否由 JS 依表格實際是否捲得動決定，不用斷點猜 */
.swipe-hint{font-size:11.5px; color:var(--ink-4); font-family:var(--mono); margin-bottom:7px; text-align:center}
.cmp-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); -webkit-overflow-scrolling:touch}
table.cmp{border-collapse:collapse; width:100%; min-width:640px; font-size:13.5px}
table.cmp th, table.cmp td{padding:11px 14px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line)}
table.cmp thead th{
  position:sticky; top:0; background:var(--surface-2); font-family:var(--serif); font-size:15px;
  font-weight:600; border-bottom:1px solid var(--line-strong); z-index:1;
}
table.cmp thead th:first-child{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-4); font-weight:600}
table.cmp tbody th{font-weight:400; color:var(--ink-4); font-size:12.5px; white-space:nowrap; background:var(--surface); width:120px}
table.cmp td{color:var(--ink); font-variant-numeric:tabular-nums}
table.cmp tr:last-child th, table.cmp tr:last-child td{border-bottom:0}
table.cmp .diff{background:var(--indigo-soft)}

/* ============ checklist ============ */
.cl-pick{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; align-items:center}
.cl-pick select{
  font-family:inherit; font-size:14px; padding:8px 11px; border-radius:var(--r);
  border:1px solid var(--line); background:var(--surface); color:var(--ink); min-width:260px;
}
.sheet{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:26px 30px; max-width:780px;
}
.sheet-head{border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:18px}
.sheet-head h2{font-family:var(--serif); font-size:21px}
.sheet-head p{margin:5px 0 0; font-size:12.5px; color:var(--ink-3)}
.cl-group{margin-bottom:20px}
.cl-group h4{
  font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-4);
  font-family:var(--mono); font-weight:600; margin-bottom:9px;
}
.cl-item{display:flex; gap:10px; padding:7px 0; border-bottom:1px dotted var(--line); align-items:flex-start}
.cl-item:last-child{border-bottom:0}
.cl-item input{margin-top:4px; accent-color:var(--indigo); width:15px; height:15px; flex:none}
.cl-item label{font-size:13.5px; line-height:1.6; cursor:pointer}
.cl-item .v{font-family:var(--mono); font-weight:500; color:var(--indigo-text); font-variant-numeric:tabular-nums}
.cl-item input:checked + label{color:var(--ink-4); text-decoration:line-through; text-decoration-color:var(--line-strong)}
/* 第三態：本站沒有該刊的規定。不是待辦，也不等於通過。 */
.cl-item.cl-na{background:var(--surface-2); border-radius:6px; padding:7px 10px; margin:2px 0; border-bottom:0}
.cl-item.cl-na > span:last-child{font-size:13.5px; line-height:1.6; color:var(--ink-3)}
.na-mark{font-family:var(--mono); color:var(--ink-4); flex:none; width:15px; text-align:center; margin-top:2px}
.na{color:var(--ink-4); font-style:italic}

/* ============ apa ============ */
.apa{max-width:900px; display:flex; flex-direction:column; gap:26px}
.apa-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px 24px}
.apa-card > h3{font-family:var(--serif); font-size:17px; margin-bottom:4px}
.apa-card > p.lead{margin:0 0 14px; font-size:13px; color:var(--ink-3)}
.ex{
  font-family:var(--mono); font-size:12.5px; line-height:1.75; background:var(--surface-2);
  padding:11px 14px; border-radius:8px; color:var(--ink-2); overflow-x:auto; white-space:pre-wrap;
  word-break:break-word;
}
.ex .hl{color:var(--vermilion-text); font-weight:500}
.apa-rows{display:grid; grid-template-columns:150px minmax(0,1fr); gap:10px 18px; font-size:13.5px}
.apa-rows dt{color:var(--ink-4); font-size:12.5px}
.apa-rows dd{margin:0}

/* ============ about ============ */
.about{max-width:760px; font-size:14px; line-height:1.75; color:var(--ink-2)}
.about h3{font-family:var(--serif); font-size:17px; color:var(--ink); margin:22px 0 8px}
.about h3:first-child{margin-top:0}
.about ul{padding-left:20px; margin:8px 0}
.about li{margin-bottom:6px}
.about code{font-family:var(--mono); font-size:12.5px; background:var(--surface-2); padding:1px 5px; border-radius:4px}
.legend{display:grid; gap:8px; margin:10px 0}
.legend div{display:flex; gap:9px; align-items:flex-start; font-size:13.5px}

/* ============ home ============ */
.home{display:flex; flex-direction:column; gap:40px; max-width:1120px}
.hero{display:flex; flex-direction:column; gap:15px}
.hero .eyebrow{font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-4)}
/* 中文以 em 計寬，ch 是西文 "0" 的寬度，用在中文會嚴重低估 */
.hero h2{font-family:var(--serif); font-size:clamp(26px,3.4vw,38px); line-height:1.3; letter-spacing:.01em; max-width:20em}
/* 各子句自成行內塊，換行只發生在子句之間。
   中文沒有詞間空格，光靠 text-wrap:balance 會把「體例」這種詞從中間拆開。 */
.hero h2 span{display:inline-block}
.hero .lede{margin:0; font-size:15.5px; color:var(--ink-2); max-width:62ch; line-height:1.85}
.hero .metaline{display:flex; flex-wrap:wrap; gap:6px 16px; font-family:var(--mono); font-size:11.5px; color:var(--ink-4); align-items:center}
.hero .metaline .d{color:var(--line-strong)}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(146px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.stat{background:var(--surface); padding:15px 18px 16px}
.stat .n{font-family:var(--mono); font-size:27px; font-weight:600; line-height:1.05; font-variant-numeric:tabular-nums}
.stat .k{font-size:12px; color:var(--ink-4); margin-top:6px; line-height:1.5}

.spread{display:flex; flex-direction:column; gap:9px}
.spread .bar{display:flex; height:11px; gap:2px}
.spread .bar i{display:block; border-radius:2px; min-width:4px}

.hsec > h3{font-family:var(--serif); font-size:18.5px; margin-bottom:5px}
.hsec > .sub{margin:0 0 15px; font-size:13px; color:var(--ink-3); line-height:1.7; max-width:64ch}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  display:inline-flex; align-items:center; gap:9px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-2); padding:8px 13px; border-radius:8px;
  font-size:13.5px; font-family:inherit; text-align:left;
  transition:border-color .12s, color .12s, transform .12s;
}
.chip:hover{border-color:var(--line-strong); color:var(--ink); transform:translateY(-1px)}
.chip .n{font-family:var(--mono); font-size:11.5px; color:var(--ink-4); font-variant-numeric:tabular-nums}

.tools{display:grid; grid-template-columns:repeat(auto-fit,minmax(238px,1fr)); gap:13px}
.tool{
  border:1px solid var(--line); background:var(--surface); border-radius:var(--r);

.vgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:13px}
.vcard{border:1px solid var(--line); background:var(--surface); border-radius:var(--r); padding:15px 17px}
.vcard .vt{display:flex; align-items:center; gap:7px; font-size:13px; font-weight:600; margin-bottom:6px}
.vcard .vn{font-family:var(--mono); font-size:20px; font-weight:600; font-variant-numeric:tabular-nums; margin-bottom:4px}
.vcard p{margin:0; font-size:12.5px; color:var(--ink-4); line-height:1.6}

/* ============ group headings ============ */
.gsec{margin-bottom:32px}
.gsec:last-child{margin-bottom:6px}
.ghead{display:flex; align-items:baseline; gap:11px; margin-bottom:13px; padding-bottom:8px; border-bottom:1px solid var(--line)}
.ghead .gt{font-family:var(--serif); font-size:16.5px; font-weight:600}
.ghead .gn{font-family:var(--mono); font-size:11.5px; color:var(--ink-4); font-variant-numeric:tabular-nums}
.ghead .gd{font-size:12.5px; color:var(--ink-4); margin-left:auto; text-align:right; max-width:46ch}

/* ============ credit ============ */
.credit{border-top:1px solid var(--line); background:var(--surface); margin-top:20px}
.credit-in{

.credit .sep{color:var(--line-strong)}
.credit .who{color:var(--ink-3)}

.credit .asof{margin-left:auto; font-family:var(--mono); font-size:11.5px; color:var(--ink-4); font-variant-numeric:tabular-nums}

.hide{display:none !important}

/* =====================================================================

      820px  卡片放不下兩欄 → 單欄，導覽列改為搜尋獨占一行

/* 讓 grid/flex 子項可以縮到比內容窄，否則長字串會把版面撐開 */
.wrap, .grid, .card, .cmp-wrap, .home, .sheet, .apa-card, .drawer{min-width:0}
.card > *, .facts dd, .rows dd{min-width:0; overflow-wrap:anywhere}

/* ---- 1100px：側欄轉為頂部橫向篩選，可收合 ---- */
.ftog{display:none}
@media(max-width:1100px){
  .wrap{grid-template-columns:minmax(0,1fr); gap:14px}
  aside{position:static; max-height:none; overflow:visible; gap:14px; padding-right:0}
  .ftog{
    display:flex; align-items:center; gap:8px; width:100%;

    padding:10px 14px; border-radius:var(--r); font-size:13.5px;

  .ftog:hover{border-color:var(--line-strong); color:var(--ink)}
  .ftog .caret{margin-left:auto; color:var(--ink-4); transition:transform .15s}

    font-family:var(--mono); font-size:11px; background:var(--indigo-soft);
    color:var(--indigo-text); padding:1px 7px; border-radius:5px;
  }
  aside.collapsed .fgroup, aside.collapsed .reset{display:none}
  .fopts{flex-direction:row; flex-wrap:wrap; gap:6px}
  .fopt{width:auto; border:1px solid var(--line); background:var(--surface); border-radius:8px}
  .fopt .n{margin-left:2px}
}

/* ---- 820px：導覽列重排、卡片單欄 ---- */
@media(max-width:820px){
  .top-in{padding:11px 16px; gap:10px 12px}
  .brand h1{font-size:17.5px}
  .search{order:3; flex-basis:100%; max-width:none}
  .tabs{order:2; overflow-x:auto; max-width:100%; scrollbar-width:none; -webkit-overflow-scrolling:touch}

  .wrap{padding:16px}

  .home{gap:30px}
  .hero h2{font-size:clamp(23px,5.2vw,31px)}
  .hero .lede{font-size:14.5px; line-height:1.8}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat{padding:13px 15px 14px}
  .stat .n{font-size:23px}

  .stat:nth-child(odd):last-child{grid-column:1 / -1}
  .tools{grid-template-columns:minmax(0,1fr)}
  .vgrid{grid-template-columns:minmax(0,1fr)}

  .ghead{flex-wrap:wrap}
  .ghead .gd{margin-left:0; text-align:left; flex-basis:100%; max-width:none}

  .dhead{padding:16px 18px 13px}
  .dbody{padding:17px 18px 34px}
  .sheet{padding:20px 18px}
  .apa-card{padding:17px 18px}

  .credit-in{padding:17px 16px 26px}
  .credit .asof{margin-left:0; flex-basis:100%}
  .credit .sep{display:none}
  .credit .who{flex-basis:100%}
}

/* ---- 600px：手機直式 ---- */
@media(max-width:600px){
  .top-in{padding:10px 13px}
  .brand h1{font-size:16.5px}
  .brand .sub{display:none}
  .search input{font-size:16px} /* iOS 低於 16px 會在聚焦時自動放大 */

  .wrap{padding:13px}
  .rhead .hint{display:none}

  .card{padding:13px 14px 11px; gap:10px}
  .cname{font-size:16.5px}
  .facts{grid-template-columns:auto minmax(0,1fr); gap:3px 10px}

  .rows{grid-template-columns:minmax(0,1fr); gap:2px 0}
  .rows dt{margin-top:9px}
  .rows dt:first-child{margin-top:0}
  .apa-rows{grid-template-columns:minmax(0,1fr); gap:3px 0}
  .apa-rows dt{margin-top:11px}
  .apa-rows dt:first-child{margin-top:0}

  .drawer{width:100%; border-left:0}
  .hero .metaline{font-size:11px}
  .sheet{padding:18px 15px; border-radius:var(--r)}
  .sheet-head h2{font-size:19px}
  .cl-pick{flex-direction:column; align-items:stretch; gap:7px}
  .cl-pick select{min-width:0; width:100%; font-size:16px}

  table.cmp{min-width:500px; font-size:12.5px}
  table.cmp th, table.cmp td{padding:9px 11px}
  table.cmp tbody th{width:88px}
  table.cmp thead th{font-size:14px}

  .ex{font-size:11.5px}
  .about{font-size:13.5px}
}

/* ---- 400px：小尺寸手機 ---- */
@media(max-width:400px){
  .wrap{padding:11px}
  .brand h1{font-size:15.5px}
  .hero h2{font-size:22px}
  .tabs button{padding:6px 9px; font-size:12.5px}
  .badges{gap:4px}
  .badge{font-size:10.5px; padding:2px 6px}
}

/* ---- 觸控裝置：把可點目標放大到手指按得到 ---- */
@media(hover:none) and (pointer:coarse){
  .fopt{padding:9px 12px}
  .chip{padding:10px 14px}
  .tabs button{padding:9px 13px}
  .pickbtn{padding:6px 11px}
  .icon-btn{width:40px; height:40px}
  .cl-item input{width:19px; height:19px; margin-top:3px}
  .cl-item{padding:9px 0}
  .linkbtn{padding:9px 14px}
  .card:hover, .tool:hover, .chip:hover{transform:none} /* 觸控沒有 hover，位移只會造成殘影 */
}

@media(max-height:520px) and (orientation:landscape){
  aside{max-height:none}
  .dhead{padding:12px 18px 10px}
  .dbody{padding:13px 18px 26px}
}

/* ---- 列印：檢查清單印出來帶著走 ---- */
@media print{
  .top, aside, .credit, .rhead, .cl-pick, .ftog{display:none !important}
  .wrap{display:block; padding:0; max-width:none}

  .cl-item{break-inside:avoid}
  .cl-group{break-inside:avoid-page}
  body{background:#fff; color:#000; font-size:11pt}
  .note{border-left-color:#999; background:#f4f4f4}
}

/* =====================================================================
   狀態與工具
   ===================================================================== */
const S = { view:"home", q:"", f:{grp:new Set(), field:new Set(), fee:new Set(), verified:new Set()}, picked:new Set(), open:null, clJournal:"", filtersOpen:null };

/* 學門歸屬：TSSCI 是分學門評比的，同樣掛「第一級」，在不同學門並不互通。
   未列出者預設為教育學門；SSCI 另成一類。 */
const DIVISION = {
  bep:"心理學門", pt:"心理學門", cjgc:"心理學門", cjp:"心理學門",
  agc:"心理學門", rap:"心理學門", ipr:"心理學門",
  mcr:"社會學門", tjs:"社會學門", ts:"社會學門", sw:"社會學門",
  tjpa:"政治學門", jhrm:"管理學門", jim:"管理學門"
};
const divOf = j => j.idx==="SSCI" ? "國際" : (DIVISION[j.id] || "教育學門");

/* 期刊總覽的分組，順序即呈現順序 */
const GROUPS = [
  { id:"edu1", title:"TSSCI 教育學門・第一級", note:"2025 年評比最高等級，教育領域最主要的發表管道",
    match:j=>j.idx==="TSSCI" && divOf(j)==="教育學門" && j.tier==="第一級" },
  { id:"edu2", title:"TSSCI 教育學門・第二級", note:"同屬 TSSCI 核心期刊，收錄地位與第一級相同",
    match:j=>j.idx==="TSSCI" && divOf(j)==="教育學門" && j.tier==="第二級" },
  { id:"psy", title:"TSSCI 心理學門", note:"2024 年評比收錄，教育心理、輔導諮商與測驗評量",
    match:j=>j.idx==="TSSCI" && divOf(j)==="心理學門" },
  { id:"soc", title:"TSSCI 社會・政治・管理學門", note:"跨足教育議題時的替代發表管道",
    match:j=>j.idx==="TSSCI" && ["社會學門","政治學門","管理學門"].includes(divOf(j)) },
  { id:"q1", title:"SSCI Q1", note:"JCR 第一四分位，國際教育類主要期刊",
    match:j=>j.idx==="SSCI" && j.tier==="Q1" },
  { id:"q2", title:"SSCI Q2", note:"JCR 第二四分位",
    match:j=>j.idx==="SSCI" && j.tier==="Q2" },
  { id:"other", title:"非核心・領域相關", note:"2025 年評比第三級，不屬核心期刊，但為該主題少數專門刊物",
    match:j=>j.idx==="非核心" }
];
const GRP_COLOR = {
  edu1:["var(--vermilion)","1"], edu2:["var(--amber)","1"], psy:["var(--vermilion)",".62"],
  soc:["var(--ink-4)",".8"], q1:["var(--violet)","1"], q2:["var(--indigo)","1"],
  other:["var(--line-strong)","1"]
};
const grpOf = j => (GROUPS.find(g=>g.match(j)) || {id:"other"}).id;

const FIELDS = ["教育學","師資培育","課程與教科書","教育心理","輔導諮商","測驗評量","數位學習","科學教育","數學教育","特殊教育","高等教育","教育行政","教育社會學","圖書資訊學","通識教育","社會學與傳播","公共行政與管理"];
const FEES = [
  {k:"free", label:"不收費・開放取用"},
  {k:"paid", label:"有審查費或刊登費"},
  {k:"hybrid", label:"訂閱制（OA 選配）"},
  {k:"apc", label:"完全 OA・須付 APC"},
  {k:"unknown", label:"費用未公開"}
];
const VERI = [
  {k:"official", label:"已讀官方稿約全文"},
  {k:"partial", label:"官方頁面摘錄"},
  {k:"listed", label:"僅確認收錄分級"}
];
const VLABEL = {official:["●","已核對官方稿約"], partial:["◐","官方頁面摘錄"], listed:["○","僅收錄分級"]};

const el = (t,c,h)=>{const e=document.createElement(t); if(c)e.className=c; if(h!==undefined)e.innerHTML=h; return e;};
const esc = s => String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));

function matches(j){
  const q = S.q.trim().toLowerCase();
  if(q){
    const hay = [j.name,j.en,j.pub,j.scope,(j.field||[]).join(" "),j.issn,j.tier,j.idx].join(" ").toLowerCase();
    if(!hay.includes(q)) return false;
  }
  if(S.f.grp.size && !S.f.grp.has(grpOf(j))) return false;
  if(S.f.field.size && !(j.field||[]).some(f=>S.f.field.has(f))) return false;
  if(S.f.fee.size && !S.f.fee.has(j.feeType||"unknown")) return false;
  if(S.f.verified.size && !S.f.verified.has(j.verified)) return false;
  return true;
}
const results = () => J.filter(matches);

/* =====================================================================
   側邊篩選
   ===================================================================== */
function renderSide(){
  const side = document.getElementById("side");
  const wrap = document.querySelector(".wrap");
  if(S.view!=="browse" && S.view!=="compare"){ side.classList.add("hide"); wrap.classList.add("solo"); return; }
  side.classList.remove("hide"); wrap.classList.remove("solo");
  side.innerHTML = "";

  // 窄螢幕：篩選預設收起，避免 30 幾個選項把卡片推到螢幕外
  const active0 = S.f.grp.size+S.f.field.size+S.f.fee.size+S.f.verified.size;
  const narrow = window.matchMedia("(max-width:1100px)").matches;
  if(S.filtersOpen === null) S.filtersOpen = !narrow;
  const open = S.filtersOpen || !narrow;
  side.classList.toggle("collapsed", !open);

  const tog = el("button","ftog");
  tog.type = "button";
  tog.setAttribute("aria-expanded", open ? "true" : "false");
  tog.innerHTML = `<span>篩選條件</span>${active0?`<span class="badge-n">${active0}</span>`:""}<span class="caret">⌄</span>`;
  tog.onclick = ()=>{ S.filtersOpen = !open; render(); };
  side.appendChild(tog);

  const countBy = (fn) => { const m={}; J.forEach(j=>{ const ks=fn(j); (Array.isArray(ks)?ks:[ks]).forEach(k=>{ if(k) m[k]=(m[k]||0)+1; }); }); return m; };
  const cGrp = countBy(grpOf), cField = countBy(j=>j.field||[]), cFee = countBy(j=>j.feeType||"unknown"), cVer = countBy(j=>j.verified);

  const group = (title, items, setName) => {
    const g = el("div","fgroup");
    g.appendChild(el("h3",null,esc(title)));
    const box = el("div","fopts");
    items.forEach(it=>{
      if(!it.n) return;
      const b = el("button","fopt");
      b.type="button";
      b.setAttribute("aria-pressed", S.f[setName].has(it.k) ? "true":"false");
      b.innerHTML = (it.c?`<span class="dot" style="background:${it.c};opacity:${it.o||1}"></span>`:"") +
                    `<span>${esc(it.label)}</span><span class="n">${it.n}</span>`;
      b.onclick = ()=>{ S.f[setName].has(it.k) ? S.f[setName].delete(it.k) : S.f[setName].add(it.k); render(); };
      box.appendChild(b);
    });
    g.appendChild(box);
    return g;
  };

  side.appendChild(group("索引與分級", GROUPS.map(g=>({
    k:g.id, label:g.title.replace("TSSCI 教育學門・","教育・").replace("TSSCI ","").replace("・領域相關",""),
    c:GRP_COLOR[g.id][0], o:GRP_COLOR[g.id][1], n:cGrp[g.id]||0
  })), "grp"));
  side.appendChild(group("學科領域", FIELDS.map(f=>({k:f,label:f,n:cField[f]||0})), "field"));
  side.appendChild(group("費用型態", FEES.map(f=>({k:f.k,label:f.label,n:cFee[f.k]||0})), "fee"));
  side.appendChild(group("資料查證程度", VERI.map(v=>({k:v.k,label:v.label,n:cVer[v.k]||0})), "verified"));

  const active = S.f.grp.size+S.f.field.size+S.f.fee.size+S.f.verified.size;
  if(active){
    const r = el("button","reset",`清除 ${active} 項篩選`);
    r.type="button";
    r.onclick = ()=>{ Object.values(S.f).forEach(s=>s.clear()); render(); };
    side.appendChild(r);
  }
}

/* =====================================================================
   卡片
   ===================================================================== */
function badgeFor(j){
  const out=[];
  const cls = j.idx==="SSCI" ? (j.tier==="Q1"?"b-q1":"b-q2")
            : j.idx==="TSSCI" ? (j.tier==="第二級"?"b-t2":"b-t1")
            : "b-t3";
  out.push(`<span class="badge ${cls}">${esc(j.idx)}${j.tier?" · "+esc(j.tier):""}</span>`);
  if(j.oa) out.push(`<span class="badge b-oa">開放取用</span>`);
  if(j.feeType==="free") out.push(`<span class="badge b-free">作者免付費</span>`);
  return out.join("");
}

function card(j){
  const b = el("button","card"+(S.picked.has(j.id)?" picked":""));
  b.type="button";
  const wc = j.idx==="SSCI" ? (j.wcEn||"—") : (j.wcZh||"—");
  const ab = j.idx==="SSCI" ? (j.absEn||"—") : (j.absZh||"—");
  const unk = v => /須查|未載明|未於/.test(v);
  const v = VLABEL[j.verified];
  b.innerHTML = `
    <div class="badges">${badgeFor(j)}</div>
    <div>
      <div class="cname">${esc(j.name)}</div>
      ${j.en && j.en!==j.name ? `<div class="cname-en">${esc(j.en)}</div>`:""}
    </div>
    <div class="cpub">${esc(j.pub)}</div>
    <dl class="facts">
      <dt>全文上限</dt><dd class="${unk(wc)?"q":""}">${esc(wc)}</dd>
      <dt>摘要</dt><dd class="${unk(ab)?"q":""}">${esc(ab)}</dd>
      <dt>文獻格式</dt><dd class="${unk(j.ref||"")?"q":""}">${esc(j.ref||"—")}</dd>
    </dl>
    <div class="cfoot">
      <span class="vstat v-${j.verified}">${v[0]} ${v[1]}</span>
      <span class="pickbtn" role="button" aria-pressed="${S.picked.has(j.id)}" data-pick="${j.id}">${S.picked.has(j.id)?"已選入比較":"加入比較"}</span>
    </div>`;
  b.onclick = (e)=>{
    const p = e.target.closest("[data-pick]");
    if(p){ e.stopPropagation(); togglePick(j.id); return; }
    openDrawer(j.id);
  };
  return b;
}

function togglePick(id){
  S.picked.has(id) ? S.picked.delete(id) : S.picked.add(id);
  render();
}

        <h4>字數與摘要</h4>
        <dl class="rows">
          ${row("中文全文", j.wcZh && j.wcZh!=="—" ? num(j.wcZh):"", j.wcNote)}
          ${row("英文全文", j.wcEn && j.wcEn!=="—" ? num(j.wcEn):"", j.idx==="SSCI"? j.wcNote : "")}
          ${row("中文摘要", j.absZh && j.absZh!=="—" ? num(j.absZh):"")}

  m.innerHTML = "";

  head.innerHTML = `<span class="rcount">${r.length} / ${J.length} 本期刊</span>
    <span class="hint">點卡片看完整格式規範 ・ 點「加入比較」並排看差異</span>`;
  m.appendChild(head);
  if(!r.length){
    m.appendChild(el("div","empty","<strong>沒有符合的期刊</strong>試著放寬篩選條件，或改用刊名關鍵字搜尋。"));
    return;
  }
  let shown = 0;
  GROUPS.forEach(grp=>{
    const list = r.filter(grp.match);
    if(!list.length) return;
    shown += list.length;
    const sec = el("section","gsec");
    sec.innerHTML = `<div class="ghead">
        <span class="gt">${esc(grp.title)}</span>
        <span class="gn">${list.length} 本</span>
        ${grp.note?`<span class="gd">${esc(grp.note)}</span>`:""}
      </div>`;
    const g = el("div","grid");
    list.forEach(j=>g.appendChild(card(j)));
    sec.appendChild(g);
    m.appendChild(sec);
  });
  // 保險：任何未落入分組的期刊仍要出現
  const rest = r.filter(j=>!GROUPS.some(grp=>grp.match(j)));
  if(rest.length){
    const sec = el("section","gsec");
    sec.innerHTML = `<div class="ghead"><span class="gt">其他</span><span class="gn">${rest.length} 本</span></div>`;
    const g = el("div","grid");
    rest.forEach(j=>g.appendChild(card(j)));
    sec.appendChild(g);
    m.appendChild(sec);
  }
}

function viewCompare(){
  const m = document.getElementById("main");
  const list = J.filter(j=>S.picked.has(j.id));
  m.innerHTML = "";
  const head = el("div","rhead");
  head.innerHTML = `<span class="rcount">已選 ${list.length} 本</span>
    <span class="hint">回到「期刊總覽」用卡片上的「加入比較」增減 ・ 有差異的欄位會標色</span>`;
  m.appendChild(head);

  if(list.length<2){
    m.appendChild(el("div","empty","<strong>至少選兩本期刊才能比較</strong>回到「期刊總覽」分頁，在卡片右下角點「加入比較」。"));
    return;
  }
  const swipe = el("div","swipe-hint hide","← 表格可左右滑動 →");
  m.appendChild(swipe);
  const wrap = el("div","cmp-wrap");
  const t = el("table","cmp");
  t.innerHTML = `<thead><tr><th>比較項目</th>${list.map(j=>`<th>${esc(j.name)}</th>`).join("")}</tr></thead>`;
  const tb = el("tbody");
  CMP_ROWS.forEach(([label,fn])=>{
    const vals = list.map(fn);
    // 標出「與多數不同」的格子；全部互異時整列都標
    const tally = {}; vals.forEach(v=>tally[v]=(tally[v]||0)+1);
    const top = Math.max(...Object.values(tally));
    const odd = v => Object.keys(tally).length>1 && tally[v] < top;
    const allDiffer = Object.keys(tally).length === vals.length && vals.length>1;
    tb.innerHTML += `<tr><th>${esc(label)}</th>${vals.map(v=>`<td class="${(allDiffer||odd(v))?"diff":""}">${esc(v)}</td>`).join("")}</tr>`;
  });
  t.appendChild(tb);
  wrap.appendChild(t);
  m.appendChild(wrap);
  // 讀 scrollWidth 會強制版面計算，所以同步就量得準。
  // 不用 requestAnimationFrame：分頁在背景時 rAF 會被暫停，提示就不會出現。
  const sizeHint = ()=> swipe.classList.toggle("hide", wrap.scrollWidth <= wrap.clientWidth + 4);
  sizeHint();
  if(window.__cmpResize) removeEventListener("resize", window.__cmpResize);
  window.__cmpResize = sizeHint;
  addEventListener("resize", sizeHint, {passive:true});

  const clr = el("button","reset","清除全部選取");
  clr.type="button"; clr.style.marginTop="14px"; clr.style.maxWidth="180px";
  clr.onclick = ()=>{ S.picked.clear(); render(); };
  m.appendChild(clr);
}

function checklistFor(j){
  const g=[];
  const ok = v => v && !/須查|未載明|未於|^—$/.test(v);
  const fmt=[];
  // 缺資料的項目不能從清單裡消失，否則使用者會以為不必檢查。
  // 一律留一列標成「本站無資料」，這是與待辦並列的第三態。
  const na = label => [`${esc(label)}：<span class="na">本站無資料，請自行對照該刊官網</span>`, "", "na"];
  // 字數欄位可能是「15,000 字為上限，如超過以 20,000 字為原則」這種整句，
  // 所以不能套「控制在 X 以內」的句式，否則會變病句
  if(j.idx!=="SSCI") fmt.push(ok(j.wcZh)
    ? [`中文全文字數符合規定：<span class="v">${esc(j.wcZh)}</span>`, j.wcNote]
    : na("中文全文字數"));
  fmt.push(ok(j.wcEn)
    ? [`${j.idx==="SSCI"?"全文":"英文全文"}字數符合規定：<span class="v">${esc(j.wcEn)}</span>`, j.idx==="SSCI"?j.wcNote:""]
    : na(j.idx==="SSCI"?"全文字數":"英文全文字數"));
  if(j.idx!=="SSCI") fmt.push(ok(j.absZh)
    ? [`中文摘要：<span class="v">${esc(j.absZh)}</span>`,""]
    : na("中文摘要字數"));
  fmt.push(ok(j.absEn)
    ? [`${j.idx==="SSCI"?"摘要":"英文摘要"}：<span class="v">${esc(j.absEn)}</span>`,""]
    : na(j.idx==="SSCI"?"摘要字數":"英文摘要字數"));
  if(j.absNote) fmt.push([esc(j.absNote),""]);
  fmt.push(ok(j.kw)
    ? [`關鍵詞：<span class="v">${esc(j.kw)}</span>${j.kwNote?"，"+esc(j.kwNote):""}`,""]
    : na("關鍵詞數量"));
  fmt.push(ok(j.ref)
    ? [`參考文獻與內文引用一律改為 <span class="v">${esc(j.ref)}</span>`,""]
    : na("參考文獻體例"));
  if(j.layout) fmt.push([esc(j.layout),""]);
  if(j.heads) fmt.push([`標題層級：${esc(j.heads)}`,""]);
  if(fmt.length) g.push(["格式規範", fmt]);

  const anon=[[`確認全文、檔案內容與檔名均無作者姓名、服務單位、計畫編號等可辨識資訊`,""],
              [`自我引用改寫成第三人稱，或暫時匿名處理`,""],
              [`致謝與經費補助說明先移除，待接受刊登後再補`,""]];
  if(j.review) anon.unshift([`審查方式：${esc(j.review)}`,""]);
  g.push(["匿名審查準備", anon]);

  const proc=[];
  if(j.freq) proc.push([`出刊頻率：${esc(j.freq)}`,""]);
  if(j.intake) proc.push([`收稿方式：${esc(j.intake)}`,""]);
  if(j.timeline) proc.push([`預期審查時程：${esc(j.timeline)}`,""]);
  if(j.fee) proc.push([`費用：<span class="v">${esc(j.fee)}</span>。請確認經費來源與核銷方式`,""]);
  if(j.system) proc.push([`於投稿系統註冊並填妥作者資料：${esc(j.system)}`,""]);
  if(j.contact) proc.push([`編輯部聯絡方式備查：${esc(j.contact)}`,""]);
  g.push(["流程與費用", proc]);

  if(j.alerts && j.alerts.length) g.push(["本刊特別要求", j.alerts.map(a=>[esc(a),""])]);

  g.push(["最後一步", [
    ["對照該刊官網現行版稿約，確認以上規定未改版",""],
    ["請未參與研究的同事讀過摘要與標題",""],
    ["確認所有共同作者已同意作者排序與投稿版本",""]
  ]]);
  return g;
}

function viewCheck(){
  const m = document.getElementById("main");
  m.innerHTML = "";
  const pick = el("div","cl-pick");
  const opts = J.slice().sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant"));
  pick.innerHTML = `<label for="clsel" style="font-size:13.5px;color:var(--ink-3)">選一本期刊，產生投稿前檢查清單：</label>
    <select id="clsel"><option value="">— 請選擇 —</option>${opts.map(j=>`<option value="${j.id}"${S.clJournal===j.id?" selected":""}>${esc(j.name)}${j.idx==="SSCI"?"（"+esc(j.tier)+"）":""}</option>`).join("")}</select>`;
  m.appendChild(pick);
  pick.querySelector("#clsel").onchange = e => { S.clJournal = e.target.value; render(); };

  if(!S.clJournal){
    m.appendChild(el("div","empty","<strong>尚未選擇期刊</strong>選定後會依該刊實際規定產生逐項清單，可直接勾選使用。"));
    return;
  }
  const j = J.find(x=>x.id===S.clJournal);
  const sheet = el("div","sheet");
  const v = VLABEL[j.verified];
  let html = `<div class="sheet-head">
      <h2>${esc(j.name)} 投稿前檢查</h2>
      <p>${esc(j.pub)} ・ ${esc(j.idx)}${j.tier?" "+esc(j.tier):""} ・ 資料查證：${v[1]}</p>
    </div>`;
  let n=0, naCount=0;
  checklistFor(j).forEach(([title,items])=>{
    html += `<div class="cl-group"><h4>${esc(title)}</h4>`;
    items.forEach(([label,sub,kind])=>{
      const detail = sub?`<br><span style="color:var(--ink-4);font-size:12.5px">${esc(sub)}</span>`:"";
      if(kind==="na"){                      // 無資料：不是待辦，不給勾選框
        naCount++;
        html += `<div class="cl-item cl-na"><span class="na-mark">—</span><span>${label}${detail}</span></div>`;
      } else {
        const id = `cl${j.id}_${n++}`;
        html += `<div class="cl-item"><input type="checkbox" id="${id}"><label for="${id}">${label}${detail}</label></div>`;
      }
    });
    html += `</div>`;
  });
  if(naCount) html += `<div class="note"><b>有 ${naCount} 項本站查不到規定</b>　這幾項標成「本站無資料」，意思是本站手上沒有該刊的數字，不是這幾項不用檢查。請直接開該刊官網的稿約確認。</div>`;
  html += `<div class="note" style="margin-top:6px"><b>提醒</b>　本清單依 2026 年 8 月 28 日查證之稿約產生。期刊稿約會改版，送出前請再對照該刊官網現行版本。</div>`;
  sheet.innerHTML = html;
  m.appendChild(sheet);
}

      <dl class="apa-rows">

        <dt>2 位作者</dt><dd>括號內用頓號：（王小明、李大同，2023）<br>行文中用「與」：王小明與李大同（2023）<br>英文括號內用 &amp;：(Smith &amp; Jones, 2023)</dd>
        <dt>3 位以上</dt><dd>第一次引用即簡化：（王小明等人，2023）／ (Smith et al., 2023)</dd>
        <dt>翻譯著作</dt><dd>（Greenberg &amp; Watson, 2006/2011）：前為原著出版年，後為譯本年</dd>
        <dt>逐字引用</dt><dd>須加頁碼：（王小明，2023，頁 45）／ (Smith, 2023, p. 45)</dd>
      </dl>
      <div class="ex">中文稿括號用<span class="hl">全形</span>（　），英文稿括號用<span class="hl">半形</span>( ) 且與作者名之間空一格半形空格。</div>
    </div>

    <div class="apa-card">
      <h3>參考文獻體例</h3>
      <p class="lead">APA 7 取消了出版地，DOI 一律寫成完整網址形式。</p>
      <dl class="apa-rows">
        <dt>期刊論文</dt><dd><div class="ex">作者（年）。<span class="hl">篇名</span>。期刊名，卷(期)，起訖頁。https://doi.org/xxxxx

Author, A. A., &amp; Author, B. B. (2023). Title of the article. <span class="hl">Journal Name, 45</span>(3), 210–228. https://doi.org/10.xxxx/xxxxx</div></dd>
        <dt>專書</dt><dd><div class="ex">作者（年）。<span class="hl">書名</span>。出版商。

Author, A. A. (2023). <span class="hl">Title of the book</span>. Publisher.</div>
        <small style="display:block;color:var(--ink-3);font-size:12px;margin-top:4px">第 7 版不再寫出版地。</small></dd>
        <dt>專書章節</dt><dd><div class="ex">作者（年）。章名。載於編者（主編），<span class="hl">書名</span>（頁 23–45）。出版商。

Author, A. A. (2023). Chapter title. In B. B. Editor (Ed.), <span class="hl">Book title</span> (pp. 23–45). Publisher.</div></dd>
        <dt>學位論文</dt><dd><div class="ex">作者（年）。<span class="hl">論文名稱</span>〔未出版之博士論文〕。校名。</div></dd>
        <dt>網頁</dt><dd><div class="ex">作者或機構（年，月日）。<span class="hl">網頁標題</span>。網站名稱。https://xxx</div></dd>
      </dl>
    </div>

    <div class="apa-card">
      <h3>中文稿的額外規範</h3>
      <p class="lead">APA 是英文體例，中文期刊各自補了一套在地規則，這幾項最常被形式審退件。</p>
      <dl class="apa-rows">
        <dt>文獻排序</dt><dd>中文文獻在前、外文在後。中文依作者姓氏筆畫排列，外文依字母排列。</dd>
        <dt>中文文獻英譯</dt><dd>部分期刊（如《測驗學刊》）要求參考文獻中的中文文獻必須加附英文翻譯，這項補做很花時間，開稿前就要決定。</dd>
        <dt>外來人名</dt><dd>逕用原文呈現。專有名詞若有慣用譯名，第一次出現時以括號標註原文；無慣用譯名則逕用原文。</dd>
        <dt>年代</dt><dd>一律標西元。</dd>
        <dt>標點</dt><dd>中文標點全形、英文標點半形；中英文交界處用全形。括號、阿拉伯數字、希臘字母一律半形。</dd>
      </dl>
    </div>

    <div class="apa-card">
      <h3>統計數值與符號</h3>
      <dl class="apa-rows">
        <dt>小數位數</dt><dd>以四捨五入取至小數點後第二位為原則。</dd>
        <dt>小數點前的 0</dt><dd>可能大於 1 的數值要寫 0：0.45、0.03<br>不可能大於 1 的數值（相關係數、機率值、比率）不寫 0：<i>r</i> = .72、<i>p</i> &lt; .001</dd>
        <dt>斜體</dt><dd>統計符號一律斜體：<i>p</i>、<i>t</i>、<i>F</i>、<i>M</i>、<i>SD</i>、<i>N</i>、<i>n</i><br>例外（不斜體）：希臘字母 α、β、γ 與統計縮寫 ANOVA、LSD、SEM</dd>
        <dt>空格</dt><dd>運算符號前後各空一格半形：<i>N</i> = 18，<i>p</i> &lt; .001</dd>
      </dl>
    </div>

    <div class="apa-card">
      <h3>圖表</h3>
      <dl class="apa-rows">
        <dt>編號與標題</dt><dd>APA 7 起，<span style="color:var(--vermilion-text);font-weight:500">圖與表的編號和標題都置於圖表「上方」</span>，這與第 6 版的圖說在下方不同。標題末不加句號。</dd>
        <dt>註解</dt><dd>置於圖表下方、靠左對齊、句末加句號。中文稿用「註：」，英文稿用斜體「<i>Note.</i>」</dd>
        <dt>多重註解順序</dt><dd>一般註解 → 特別註解（以上標 a、b、c 分段）→ 機率註解</dd>
        <dt>顏色</dt><dd>部分中文期刊（如《課程與教學季刊》）明訂只收黑白圖檔。</dd>
      </dl>
    </div>

    <div class="apa-card">
      <h3>中文標題層級</h3>
      <p class="lead">這一項不屬 APA，而是中文期刊的共同慣例，各刊字級規定略有差異。</p>
      <div class="ex">壹、（第一層，多為 16 級粗體置中）
　一、（第二層，14 級粗體齊左）
　　（一）（第三層，12 級粗體齊左）
　　　1.（第四層）
　　　　(1)（第五層，部分期刊標題後加句號直接接內文）
　　　　　①（第六層，僅部分期刊使用）</div>
      <p style="margin:12px 0 0;font-size:13px;color:var(--ink-3)">層次不可省略或跳號。《科學教育學刊》《課程與教學季刊》皆明文要求依序使用。</p>
    </div>
  </div>`;
}

function viewAbout(){
  const m = document.getElementById("main");
  const n = k => J.filter(j=>j.verified===k).length;
  m.innerHTML = `<div class="about">
    <h3>這份資料是怎麼來的</h3>
    <p>期刊名單取自國家科學及技術委員會人文社會科學研究中心「臺灣人文及社會科學期刊評比暨核心期刊收錄」官方名單：<strong>2025 年名單</strong>（教育學、政治學、經濟學、區域研究及地理、綜合類，適用 2026 年 1 月 1 日至 2028 年 12 月 31 日）與 <strong>2024 年名單</strong>（藝術學、人類學及族群研究、社會學及社福社工、心理學、法律學、管理學，適用 2025 年 1 月 1 日至 2027 年 12 月 31 日）。</p>
    <p>格式規範則逐本取自各刊自己公告的稿約、徵稿辦法或撰稿體例。<strong>沒有查到的欄位一律寫「須查官網」或「未載明」，不做推測填補。</strong></p>

    <h3>三種查證程度</h3>
    <div class="legend">
      <div><span class="vstat v-official" style="min-width:130px">● 已核對官方稿約</span><span>逐字讀過該刊官方稿約或撰稿體例全文，欄位數字直接來自原文。目前 ${n("official")} 本。</span></div>
      <div><span class="vstat v-partial" style="min-width:130px">◐ 官方頁面摘錄</span><span>取自該刊官方頁面，但未能取得完整稿約文件（例如出版商網站擋自動存取）。數字可信，但可能有未涵蓋的細項。目前 ${n("partial")} 本。</span></div>
      <div><span class="vstat v-listed" style="min-width:130px">○ 僅收錄分級</span><span>只確認了收錄狀態與評比級別，格式細節未查證。這類期刊請直接點卡片裡的官網連結。目前 ${n("listed")} 本。</span></div>
    </div>

    <h3>為什麼有些欄位是空的</h3>
    <p>Elsevier（ScienceDirect）、Wiley 與部分 SAGE、Taylor &amp; Francis 的作者指南頁面會阻擋自動存取，這些期刊只能靠搜尋引擎擷取的官方頁面內容補齊，細項因此不如中文期刊完整。每張卡片都附了該刊投稿指南的直達連結，需要細節時從那裡進去最快。</p>

    <h3>使用時請記得</h3>
    <ul>
      <li><strong>稿約會改版。</strong>本站查證日期為 2026 年 8 月 28 日。正式投稿前，請以該刊官網當下的版本為準。這裡的資料只用來快速篩選與比較，不能取代官方文件。</li>
      <li><strong>「Q1／Q2」的分區會逐年變動。</strong>本站標示的分區僅供大致定位，實際請以投稿當年度的 JCR 為準；同一本期刊在不同的 category 下分區也可能不同。</li>
      <li><strong>TSSCI 沒有 Q1／Q2。</strong>臺灣的核心期刊制度用的是第一級、第二級（第三級不屬核心期刊），與 JCR 的四分位分區是兩套不同的制度。</li>
      <li><strong>字數的計算範圍各刊不同。</strong>有的含參考文獻與圖表、有的不含；有的同時卡字數與頁數（如《教育心理學報》《測驗學刊》）。看數字時要一併看括號裡的計算方式。</li>
    </ul>

    <h3>期刊怎麼分組的</h3>
    <p>期刊總覽依「索引體系 × 學門」分組，而不是把 52 本排成一片。這樣分是因為<strong>各學門是分開評比的</strong>：同樣掛「第一級」，教育學門與政治學門是兩份互不相干的名單，混在一起看會誤判競爭程度。</p>
    <ul>
      <li><strong>TSSCI 教育學門・第一級</strong>（12 本）與<strong>第二級</strong>（7 本）　2025 年評比，適用至 2028 年底。兩級同屬核心期刊，收錄地位相同。</li>
      <li><strong>TSSCI 心理學門</strong>（7 本）　2024 年評比，含教育心理、輔導諮商與測驗評量。</li>
      <li><strong>TSSCI 社會・政治・管理學門</strong>（7 本）　跨足教育議題時的替代管道。</li>
      <li><strong>SSCI Q1</strong>（16 本）與 <strong>Q2</strong>（2 本）　JCR 四分位。</li>
      <li><strong>非核心・領域相關</strong>（1 本）　《師資培育與教師專業發展期刊》為 2025 年評比第三級，不屬核心期刊，但為國內師資培育少數的專門刊物，所以一併收錄並明確標示。</li>
    </ul>

    <h3>各分頁的用途</h3>
    <ul>
      <li><strong>首頁</strong>　依索引分級或學科領域點進去，會直接帶著篩選條件跳到期刊總覽。</li>
      <li><strong>期刊總覽</strong>　分組排列，左側可再用領域、費用、查證程度縮小範圍。卡片正面就顯示字數、摘要、文獻格式三個最常查的欄位；點卡片看完整規範。</li>
      <li><strong>比較</strong>　在卡片上點「加入比較」選 2 本以上並排，只有與其他期刊不同的欄位會標色。決定要投哪一本時最好用。</li>
      <li><strong>檢查清單</strong>　選定期刊後依該刊實際規定產生逐項清單，可直接勾選。投稿前最後一輪自檢用。</li>
      <li><strong>APA 7</strong>　常用體例速查，含中文期刊特有的在地規範（文獻排序、中文文獻英譯、全形半形標點）。</li>
    </ul>
    <p style="color:var(--ink-4);font-size:13px">鍵盤：按 <code>/</code> 跳到搜尋框，按 <code>Esc</code> 關閉期刊詳情。點左上角刊名回首頁。</p>
  </div>`;
}

/* =====================================================================
   render
   ===================================================================== */
function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute("aria-selected", b.dataset.view===S.view?"true":"false"));
  document.getElementById("cmpn").textContent = S.picked.size ? `(${S.picked.size})` : "";
  document.getElementById("qclr").classList.toggle("hide", !S.q);
  renderSide();
  ({home:viewHome, browse:viewBrowse, compare:viewCompare, check:viewCheck, apa:viewApa, about:viewAbout})[S.view]();
}

document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick = ()=>{ S.view = b.dataset.view; render(); window.scrollTo({top:0,behavior:"instant"}); };
});
document.getElementById("brand").onclick = ()=>{ S.view="home"; render(); window.scrollTo({top:0}); };

// 跨越 1100px 斷點時，篩選欄要在「橫向可收合」與「側欄常駐」之間切換
let wasNarrow = matchMedia("(max-width:1100px)").matches;
addEventListener("resize", ()=>{
  const n = matchMedia("(max-width:1100px)").matches;
  if(n !== wasNarrow){ wasNarrow = n; renderSide(); }
});
const qi = document.getElementById("q");
qi.oninput = e => { S.q = e.target.value; if(S.view!=="browse"&&S.view!=="compare"){S.view="browse";} render(); };
document.getElementById("qclr").onclick = ()=>{ S.q=""; qi.value=""; qi.focus(); render(); };
document.getElementById("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if(S.open) closeDrawer(); }
  if(e.key==="/" && document.activeElement!==qi){ e.preventDefault(); qi.focus(); }
});

const tb = document.getElementById("theme");
try{
  const saved = localStorage.getItem("tsq-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
}catch(_){}
tb.onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  const next = isDark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("tsq-theme", next); }catch(_){}
};

render();
</script>
