<title>國內外期刊投稿格式平台</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+TC:wght@600;700&display=swap">

<style>
/* ============ tokens ============ */
:root{
  --ink:#16202e; --ink-2:#38455a; --ink-3:#5d6b81; --ink-4:#8593a8;
  --ground:#f7f8fa; --surface:#ffffff; --surface-2:#eef1f6; --surface-3:#e3e8f0;
  --line:#d8dfe9; --line-strong:#b9c4d4;
  --indigo:#29457a; --indigo-soft:#dde5f4; --indigo-text:#29457a;
  --vermilion:#b33a2b; --vermilion-soft:#f8e2de; --vermilion-text:#96301f;
  --violet:#5b4b8a; --violet-soft:#e8e3f4; --violet-text:#4c3d79;
  --amber:#b77f2e; --amber-soft:#f8ecd8; --amber-text:#8f6118;
  --green:#3f7a52; --green-soft:#dff0e4; --green-text:#2e6540;
  --shadow:0 1px 2px rgba(22,32,46,.06),0 8px 24px -12px rgba(22,32,46,.18);
  --shadow-lg:0 2px 6px rgba(22,32,46,.08),0 24px 56px -20px rgba(22,32,46,.3);
  --sans:"IBM Plex Sans TC","IBM Plex Sans","Helvetica Neue",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Songti TC",Georgia,serif;
  --mono:"IBM Plex Mono","SF Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e5eaf2; --ink-2:#b9c4d4; --ink-3:#8d9bb0; --ink-4:#6b7a90;
    --ground:#0e141d; --surface:#161e2a; --surface-2:#1e2836; --surface-3:#273343;
    --line:#2b3747; --line-strong:#3d4c60;
    --indigo:#8fb0e6; --indigo-soft:#1d2c47; --indigo-text:#a6c1ef;
    --vermilion:#e8836f; --vermilion-soft:#3a2019; --vermilion-text:#f0977f;
    --violet:#a698d8; --violet-soft:#272141; --violet-text:#b5a8e2;
    --amber:#dfa958; --amber-soft:#33280f; --amber-text:#e6b96f;
    --green:#7ec293; --green-soft:#16301f; --green-text:#8fd0a4;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
    --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 56px -20px rgba(0,0,0,.75);
  }
}
:root[data-theme="dark"]{
  --ink:#e5eaf2; --ink-2:#b9c4d4; --ink-3:#8d9bb0; --ink-4:#6b7a90;
  --ground:#0e141d; --surface:#161e2a; --surface-2:#1e2836; --surface-3:#273343;
  --line:#2b3747; --line-strong:#3d4c60;
  --indigo:#8fb0e6; --indigo-soft:#1d2c47; --indigo-text:#a6c1ef;
  --vermilion:#e8836f; --vermilion-soft:#3a2019; --vermilion-text:#f0977f;
  --violet:#a698d8; --violet-soft:#272141; --violet-text:#b5a8e2;
  --amber:#dfa958; --amber-soft:#33280f; --amber-text:#e6b96f;
  --green:#7ec293; --green-soft:#16301f; --green-text:#8fd0a4;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
  --shadow-lg:0 2px 6px rgba(0,0,0,.5),0 24px 56px -20px rgba(0,0,0,.75);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.65;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; text-wrap:balance; font-weight:600; line-height:1.3}
a{color:var(--indigo-text)}
button{font-family:inherit; font-size:inherit; cursor:pointer}
:focus-visible{outline:2px solid var(--indigo); outline-offset:2px; border-radius:4px}

/* ============ shell ============ */
.top{
  position:sticky; top:0; z-index:40; background:var(--surface);
  border-bottom:1px solid var(--line);
}
.top-in{max-width:1560px; margin:0 auto; padding:14px 22px; display:flex; flex-wrap:wrap; gap:16px; align-items:center}
.brand{display:flex; align-items:baseline; gap:10px; margin-right:auto; border:0; background:none; padding:0; color:inherit; border-radius:6px}
.brand:hover h1{color:var(--indigo-text)}
.brand h1{font-family:var(--serif); font-size:20px; letter-spacing:.01em}
.brand .sub{font-size:12px; color:var(--ink-4); font-family:var(--mono); letter-spacing:.02em}

.search{position:relative; flex:1 1 320px; max-width:460px}
.search input{
  width:100%; padding:9px 34px 9px 34px; font-family:inherit; font-size:14px;
  background:var(--surface-2); color:var(--ink);
  border:1px solid var(--line); border-radius:var(--r);
}
.search input::placeholder{color:var(--ink-4)}
.search .ico{position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--ink-4); pointer-events:none; font-size:13px}
.search .clr{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:0; background:none; color:var(--ink-4); padding:4px 7px; font-size:15px; line-height:1; border-radius:6px}
.search .clr:hover{color:var(--ink); background:var(--surface-3)}

.tabs{display:flex; gap:2px; background:var(--surface-2); padding:3px; border-radius:var(--r); border:1px solid var(--line)}
.tabs button{
  border:0; background:none; color:var(--ink-3); padding:6px 13px;
  border-radius:7px; font-size:13.5px; font-weight:500; white-space:nowrap;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:var(--shadow); font-weight:600}

.icon-btn{
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
  width:36px; height:36px; border-radius:var(--r); display:grid; place-items:center; font-size:15px;
}
.icon-btn:hover{background:var(--surface-3); color:var(--ink)}

/* ============ layout ============ */
.wrap{max-width:1560px; margin:0 auto; padding:22px; display:grid; grid-template-columns:238px minmax(0,1fr); gap:26px; align-items:start}
.wrap.solo{grid-template-columns:minmax(0,1fr)}

aside{position:sticky; top:78px; display:flex; flex-direction:column; gap:20px; max-height:calc(100vh - 100px); overflow-y:auto; padding-right:4px}
.fgroup h3{
  font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-4);
  font-weight:600; margin-bottom:9px; font-family:var(--mono);
}
.fopts{display:flex; flex-direction:column; gap:1px}
.fopt{
  display:flex; align-items:center; gap:8px; padding:5px 9px; border-radius:7px;
  font-size:13.5px; color:var(--ink-2); border:0; background:none; text-align:left; width:100%;
}
.fopt:hover{background:var(--surface-2); color:var(--ink)}
.fopt[aria-pressed="true"]{background:var(--indigo-soft); color:var(--indigo-text); font-weight:600}
.fopt .n{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--ink-4); font-variant-numeric:tabular-nums}
.fopt[aria-pressed="true"] .n{color:var(--indigo-text)}
.dot{width:8px; height:8px; border-radius:2px; flex:none}

.reset{
  border:1px solid var(--line); background:var(--surface); color:var(--ink-3);
  padding:7px 12px; border-radius:var(--r); font-size:13px; width:100%;
}
.reset:hover{border-color:var(--line-strong); color:var(--ink)}

/* ============ results ============ */
.rhead{display:flex; align-items:baseline; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.rcount{font-family:var(--mono); font-size:13px; color:var(--ink-3); font-variant-numeric:tabular-nums}
.rhead .hint{font-size:12.5px; color:var(--ink-4); margin-left:auto}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:14px}

.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:15px 16px 13px; display:flex; flex-direction:column; gap:11px;
  text-align:left; width:100%; font:inherit; color:inherit;
  transition:border-color .12s, box-shadow .12s, transform .12s;
}
.card:hover{border-color:var(--line-strong); box-shadow:var(--shadow); transform:translateY(-1px)}
.card.picked{border-color:var(--indigo); box-shadow:0 0 0 1px var(--indigo)}

.badges{display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.badge{
  font-size:11px; font-weight:600; padding:2.5px 7px; border-radius:5px;
  font-family:var(--mono); letter-spacing:.01em; white-space:nowrap;
}
.b-t1{background:var(--vermilion-soft); color:var(--vermilion-text)}
.b-t2{background:var(--amber-soft); color:var(--amber-text)}
.b-t3{background:var(--surface-3); color:var(--ink-3)}
.b-q1{background:var(--violet-soft); color:var(--violet-text)}
.b-q2{background:var(--indigo-soft); color:var(--indigo-text)}
.b-oa{background:var(--green-soft); color:var(--green-text)}
.b-free{background:var(--green-soft); color:var(--green-text)}
/* 暫停收稿：這是唯一用實心底色的徽章，因為它會讓人白做工 */
.b-stop{background:var(--vermilion); color:#fff; letter-spacing:.04em}
:root[data-theme="dark"] .b-stop{color:var(--ground)}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .b-stop{color:var(--ground)} }
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .b-stop{color:#fff} }

.cname{font-family:var(--serif); font-size:17.5px; font-weight:600; line-height:1.35; letter-spacing:.01em}
.cname-en{font-size:12px; color:var(--ink-4); line-height:1.45; margin-top:3px; font-style:italic}
.cpub{font-size:12px; color:var(--ink-3)}

.facts{display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:12.5px; margin-top:1px}
.facts dt{color:var(--ink-4); white-space:nowrap}
.facts dd{margin:0; color:var(--ink-2); font-family:var(--mono); font-size:12px; font-variant-numeric:tabular-nums}
.facts dd.q{color:var(--ink-4); font-style:italic; font-family:var(--sans)}

.cfoot{display:flex; align-items:center; gap:8px; margin-top:2px; padding-top:9px; border-top:1px solid var(--line)}
.vstat{font-size:11px; font-family:var(--mono); display:flex; align-items:center; gap:5px}
.v-official{color:var(--green-text)}
.v-partial{color:var(--amber-text)}
.v-listed{color:var(--ink-4)}
.pickbtn{
  margin-left:auto; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-3);
  font-size:11.5px; padding:3px 9px; border-radius:6px; font-family:var(--mono);
}
.pickbtn:hover{border-color:var(--line-strong); color:var(--ink)}
.pickbtn[aria-pressed="true"]{background:var(--indigo); border-color:var(--indigo); color:#fff}
:root[data-theme="dark"] .pickbtn[aria-pressed="true"], :root:not([data-theme="light"]) .pickbtn[aria-pressed="true"]{color:var(--ground)}
@media (prefers-color-scheme:light){ :root:not([data-theme="dark"]) .pickbtn[aria-pressed="true"]{color:#fff} }

.empty{padding:60px 20px; text-align:center; color:var(--ink-4)}
.empty strong{display:block; color:var(--ink-2); font-size:16px; margin-bottom:6px; font-family:var(--serif)}

/* ============ drawer ============ */
.scrim{position:fixed; inset:0; background:rgba(14,20,29,.42); z-index:50; opacity:0; pointer-events:none; transition:opacity .18s}
.scrim.on{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; top:0; right:0; bottom:0; width:min(660px,100%); z-index:51;
  background:var(--surface); border-left:1px solid var(--line); box-shadow:var(--shadow-lg);
  transform:translateX(100%); transition:transform .22s cubic-bezier(.32,.72,0,1);
  display:flex; flex-direction:column;
}
.drawer.on{transform:none}
@media(prefers-reduced-motion:reduce){ .drawer,.scrim{transition:none} }
.dhead{padding:20px 24px 15px; border-bottom:1px solid var(--line); display:flex; gap:14px; align-items:flex-start}
.dhead .x{border:0; background:var(--surface-2); color:var(--ink-3); width:30px; height:30px; border-radius:7px; flex:none; font-size:16px; line-height:1}
.dhead .x:hover{background:var(--surface-3); color:var(--ink)}
.dbody{padding:20px 24px 40px; overflow-y:auto; flex:1}

.sect{margin-bottom:24px}
.sect > h4{
  font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-4);
  font-family:var(--mono); font-weight:600; margin-bottom:10px;
  padding-bottom:6px; border-bottom:1px solid var(--line);
}
.rows{display:grid; grid-template-columns:118px minmax(0,1fr); gap:9px 16px; font-size:13.5px}
.rows dt{color:var(--ink-4); font-size:12.5px; padding-top:1px}
.rows dd{margin:0; color:var(--ink); line-height:1.6}
.rows dd .num{font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:500}
.rows dd small{display:block; color:var(--ink-3); font-size:12px; margin-top:2px; line-height:1.55}

.note{
  background:var(--amber-soft); border-left:2.5px solid var(--amber);
  padding:10px 13px; border-radius:0 7px 7px 0; font-size:13px; color:var(--ink-2); line-height:1.6;
}
.note + .note{margin-top:8px}
.note b{color:var(--amber-text)}

.linkrow{display:flex; flex-wrap:wrap; gap:8px}
.linkbtn{
  display:inline-flex; align-items:center; gap:6px; text-decoration:none;
  border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2);
  padding:7px 12px; border-radius:8px; font-size:13px;
}
.linkbtn:hover{border-color:var(--line-strong); color:var(--ink); background:var(--surface-3)}
.linkbtn .ar{color:var(--ink-4); font-size:11px}

.srcbox{font-size:12px; color:var(--ink-3); line-height:1.6; background:var(--surface-2); padding:11px 13px; border-radius:8px}
.srcbox code{font-family:var(--mono); font-size:11.5px; color:var(--ink-2)}

/* ============ compare ============ */
/* 顯示與否由 JS 依表格實際是否捲得動決定，不用斷點猜 */
.swipe-hint{font-size:11.5px; color:var(--ink-4); font-family:var(--mono); margin-bottom:7px; text-align:center}
.cmp-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface); -webkit-overflow-scrolling:touch}
table.cmp{border-collapse:collapse; width:100%; min-width:640px; font-size:13.5px}
table.cmp th, table.cmp td{padding:11px 14px; text-align:left; vertical-align:top; border-bottom:1px solid var(--line)}
table.cmp thead th{
  position:sticky; top:0; background:var(--surface-2); font-family:var(--serif); font-size:15px;
  font-weight:600; border-bottom:1px solid var(--line-strong); z-index:1;
}
table.cmp thead th:first-child{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-4); font-weight:600}
table.cmp tbody th{font-weight:400; color:var(--ink-4); font-size:12.5px; white-space:nowrap; background:var(--surface); width:120px}
table.cmp td{color:var(--ink); font-variant-numeric:tabular-nums}
table.cmp tr:last-child th, table.cmp tr:last-child td{border-bottom:0}
table.cmp .diff{background:var(--indigo-soft)}

/* ============ checklist ============ */
.cl-pick{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; align-items:center}
.cl-pick select{
  font-family:inherit; font-size:14px; padding:8px 11px; border-radius:var(--r);
  border:1px solid var(--line); background:var(--surface); color:var(--ink); min-width:260px;
}
.sheet{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:26px 30px; max-width:780px;
}
.sheet-head{border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:18px}
.sheet-head h2{font-family:var(--serif); font-size:21px}
.sheet-head p{margin:5px 0 0; font-size:12.5px; color:var(--ink-3)}
.cl-group{margin-bottom:20px}
.cl-group h4{
  font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-4);
  font-family:var(--mono); font-weight:600; margin-bottom:9px;
}
.cl-item{display:flex; gap:10px; padding:7px 0; border-bottom:1px dotted var(--line); align-items:flex-start}
.cl-item:last-child{border-bottom:0}
.cl-item input{margin-top:4px; accent-color:var(--indigo); width:15px; height:15px; flex:none}
.cl-item label{font-size:13.5px; line-height:1.6; cursor:pointer}
.cl-item .v{font-family:var(--mono); font-weight:500; color:var(--indigo-text); font-variant-numeric:tabular-nums}
.cl-item input:checked + label{color:var(--ink-4); text-decoration:line-through; text-decoration-color:var(--line-strong)}
/* 第三態：本站沒有該刊的規定。不是待辦，也不等於通過。 */
.cl-item.cl-na{background:var(--surface-2); border-radius:6px; padding:7px 10px; margin:2px 0; border-bottom:0}
.cl-item.cl-na > span:last-child{font-size:13.5px; line-height:1.6; color:var(--ink-3)}
.na-mark{font-family:var(--mono); color:var(--ink-4); flex:none; width:15px; text-align:center; margin-top:2px}
.na{color:var(--ink-4); font-style:italic}

/* ============ apa ============ */
.apa{max-width:900px; display:flex; flex-direction:column; gap:26px}
.apa-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:20px 24px}
.apa-card > h3{font-family:var(--serif); font-size:17px; margin-bottom:4px}
.apa-card > p.lead{margin:0 0 14px; font-size:13px; color:var(--ink-3)}
.ex{
  font-family:var(--mono); font-size:12.5px; line-height:1.75; background:var(--surface-2);
  padding:11px 14px; border-radius:8px; color:var(--ink-2); overflow-x:auto; white-space:pre-wrap;
  word-break:break-word;
}
.ex .hl{color:var(--vermilion-text); font-weight:500}
.apa-rows{display:grid; grid-template-columns:150px minmax(0,1fr); gap:10px 18px; font-size:13.5px}
.apa-rows dt{color:var(--ink-4); font-size:12.5px}
.apa-rows dd{margin:0}

/* ============ about ============ */
.about{max-width:760px; font-size:14px; line-height:1.75; color:var(--ink-2)}
.about h3{font-family:var(--serif); font-size:17px; color:var(--ink); margin:22px 0 8px}
.about h3:first-child{margin-top:0}
.about ul{padding-left:20px; margin:8px 0}
.about li{margin-bottom:6px}
.about code{font-family:var(--mono); font-size:12.5px; background:var(--surface-2); padding:1px 5px; border-radius:4px}
.legend{display:grid; gap:8px; margin:10px 0}
.legend div{display:flex; gap:9px; align-items:flex-start; font-size:13.5px}

/* ============ home ============ */
.home{display:flex; flex-direction:column; gap:40px; max-width:1120px}
.hero{display:flex; flex-direction:column; gap:15px}
.hero .eyebrow{font-family:var(--mono); font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-4)}
/* 中文以 em 計寬，ch 是西文 "0" 的寬度，用在中文會嚴重低估 */
.hero h2{font-family:var(--serif); font-size:clamp(26px,3.4vw,38px); line-height:1.3; letter-spacing:.01em; max-width:20em}
/* 各子句自成行內塊，換行只發生在子句之間。
   中文沒有詞間空格，光靠 text-wrap:balance 會把「體例」這種詞從中間拆開。 */
.hero h2 span{display:inline-block}
.hero .lede{margin:0; font-size:15.5px; color:var(--ink-2); max-width:62ch; line-height:1.85}
.hero .metaline{display:flex; flex-wrap:wrap; gap:6px 16px; font-family:var(--mono); font-size:11.5px; color:var(--ink-4); align-items:center}
.hero .metaline .d{color:var(--line-strong)}

.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(146px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.stat{background:var(--surface); padding:15px 18px 16px}
.stat .n{font-family:var(--mono); font-size:27px; font-weight:600; line-height:1.05; font-variant-numeric:tabular-nums}
.stat .k{font-size:12px; color:var(--ink-4); margin-top:6px; line-height:1.5}

.spread{display:flex; flex-direction:column; gap:9px}
.spread .bar{display:flex; height:11px; gap:2px}
.spread .bar i{display:block; border-radius:2px; min-width:4px}

.hsec > h3{font-family:var(--serif); font-size:18.5px; margin-bottom:5px}
.hsec > .sub{margin:0 0 15px; font-size:13px; color:var(--ink-3); line-height:1.7; max-width:64ch}

.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{
  display:inline-flex; align-items:center; gap:9px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink-2); padding:8px 13px; border-radius:8px;
  font-size:13.5px; font-family:inherit; text-align:left;

  if(S.f.field.size && !(j.field||[]).some(f=>S.f.field.has(f))) return false;
  if(S.f.fee.size && !S.f.fee.has(j.feeType||"unknown")) return false;
  if(S.f.verified.size && !S.f.verified.has(j.verified)) return false;
  return true;
}
const results = () => J.filter(matches);

/* =====================================================================
   側邊篩選
   ===================================================================== */
function renderSide(){
  const side = document.getElementById("side");
  const wrap = document.querySelector(".wrap");
  if(S.view!=="browse" && S.view!=="compare"){ side.classList.add("hide"); wrap.classList.add("solo"); return; }
  side.classList.remove("hide"); wrap.classList.remove("solo");
  side.innerHTML = "";

  // 窄螢幕：篩選預設收起，避免 30 幾個選項把卡片推到螢幕外
  const active0 = S.f.grp.size+S.f.field.size+S.f.fee.size+S.f.verified.size;
  const narrow = window.matchMedia("(max-width:1100px)").matches;
  if(S.filtersOpen === null) S.filtersOpen = !narrow;
  const open = S.filtersOpen || !narrow;
  side.classList.toggle("collapsed", !open);

  const tog = el("button","ftog");
  tog.type = "button";
  tog.setAttribute("aria-expanded", open ? "true" : "false");
  tog.innerHTML = `<span>篩選條件</span>${active0?`<span class="badge-n">${active0}</span>`:""}<span class="caret">⌄</span>`;
  tog.onclick = ()=>{ S.filtersOpen = !open; render(); };
  side.appendChild(tog);

  const countBy = (fn) => { const m={}; J.forEach(j=>{ const ks=fn(j); (Array.isArray(ks)?ks:[ks]).forEach(k=>{ if(k) m[k]=(m[k]||0)+1; }); }); return m; };
  const cGrp = countBy(grpOf), cField = countBy(j=>j.field||[]), cFee = countBy(j=>j.feeType||"unknown"), cVer = countBy(j=>j.verified);

  const group = (title, items, setName) => {
    const g = el("div","fgroup");
    g.appendChild(el("h3",null,esc(title)));
    const box = el("div","fopts");
    items.forEach(it=>{
      if(!it.n) return;
      const b = el("button","fopt");
      b.type="button";
      b.setAttribute("aria-pressed", S.f[setName].has(it.k) ? "true":"false");
      b.innerHTML = (it.c?`<span class="dot" style="background:${it.c};opacity:${it.o||1}"></span>`:"") +
                    `<span>${esc(it.label)}</span><span class="n">${it.n}</span>`;
      b.onclick = ()=>{ S.f[setName].has(it.k) ? S.f[setName].delete(it.k) : S.f[setName].add(it.k); render(); };
      box.appendChild(b);
    });
    g.appendChild(box);
    return g;
  };

  side.appendChild(group("索引與分級", GROUPS.map(g=>({
    k:g.id, label:g.title.replace("TSSCI 教育學門・","教育・").replace("TSSCI ","").replace("・領域相關",""),
    c:GRP_COLOR[g.id][0], o:GRP_COLOR[g.id][1], n:cGrp[g.id]||0
  })), "grp"));
  side.appendChild(group("學科領域", FIELDS.map(f=>({k:f,label:f,n:cField[f]||0})), "field"));
  side.appendChild(group("費用型態", FEES.map(f=>({k:f.k,label:f.label,n:cFee[f.k]||0})), "fee"));
  side.appendChild(group("資料查證程度", VERI.map(v=>({k:v.k,label:v.label,n:cVer[v.k]||0})), "verified"));

  const active = S.f.grp.size+S.f.field.size+S.f.fee.size+S.f.verified.size;
  if(active){
    const r = el("button","reset",`清除 ${active} 項篩選`);
    r.type="button";
    r.onclick = ()=>{ Object.values(S.f).forEach(s=>s.clear()); render(); };
    side.appendChild(r);
  }
}

function badgeFor(j){
  const out=[];
  // 暫停收稿放最前面：這是會讓人白做工的資訊，不該要點開才看得到
  if(j.status==="suspended") out.push(`<span class="badge b-stop">暫停收稿</span>`);
  const cls = j.idx==="SSCI" ? (j.tier==="Q1"?"b-q1":"b-q2")
            : j.idx==="TSSCI" ? (j.tier==="第二級"?"b-t2":"b-t1")
            : "b-t3";
  out.push(`<span class="badge ${cls}">${esc(j.idx)}${j.tier?" · "+esc(j.tier):""}</span>`);
  if(j.oa) out.push(`<span class="badge b-oa">開放取用</span>`);
  if(j.feeType==="free") out.push(`<span class="badge b-free">作者免付費</span>`);
  return out.join("");
}

function card(j){
  const b = el("button","card"+(S.picked.has(j.id)?" picked":""));
  b.type="button";
  const wc = j.idx==="SSCI" ? (j.wcEn||"—") : (j.wcZh||"—");
  const ab = j.idx==="SSCI" ? (j.absEn||"—") : (j.absZh||"—");
  const unk = v => /須查|未載明|未於/.test(v);
  const v = VLABEL[j.verified];
  b.innerHTML = `
    <div class="badges">${badgeFor(j)}</div>
    <div>
      <div class="cname">${esc(j.name)}</div>
      ${j.en && j.en!==j.name ? `<div class="cname-en">${esc(j.en)}</div>`:""}
    </div>
    <div class="cpub">${esc(j.pub)}</div>
    <dl class="facts">
      <dt>全文上限</dt><dd class="${unk(wc)?"q":""}">${esc(wc)}</dd>
      <dt>摘要</dt><dd class="${unk(ab)?"q":""}">${esc(ab)}</dd>
      <dt>文獻格式</dt><dd class="${unk(j.ref||"")?"q":""}">${esc(j.ref||"—")}</dd>
    </dl>
    <div class="cfoot">
      <span class="vstat v-${j.verified}">${v[0]} ${v[1]}</span>
      <span class="pickbtn" role="button" aria-pressed="${S.picked.has(j.id)}" data-pick="${j.id}">${S.picked.has(j.id)?"已選入比較":"加入比較"}</span>
    </div>`;
  b.onclick = (e)=>{
    const p = e.target.closest("[data-pick]");
    if(p){ e.stopPropagation(); togglePick(j.id); return; }
    openDrawer(j.id);
  };
  return b;
}

function togglePick(id){
  S.picked.has(id) ? S.picked.delete(id) : S.picked.add(id);
  render();
}

function viewBrowse(){
  const m = document.getElementById("main");
  const r = results();
  m.innerHTML = "";
  const head = el("div","rhead");
  head.innerHTML = `<span class="rcount">${r.length} / ${J.length} 本期刊</span>
    <span class="hint">點卡片看完整格式規範 ・ 點「加入比較」並排看差異</span>`;
  m.appendChild(head);
  if(!r.length){
    m.appendChild(el("div","empty","<strong>沒有符合的期刊</strong>試著放寬篩選條件，或改用刊名關鍵字搜尋。"));
    return;
  }
  let shown = 0;
  GROUPS.forEach(grp=>{
    const list = r.filter(grp.match);
    if(!list.length) return;
    shown += list.length;
    const sec = el("section","gsec");
    sec.innerHTML = `<div class="ghead">
        <span class="gt">${esc(grp.title)}</span>
        <span class="gn">${list.length} 本</span>
        ${grp.note?`<span class="gd">${esc(grp.note)}</span>`:""}
      </div>`;
    const g = el("div","grid");
    list.forEach(j=>g.appendChild(card(j)));
    sec.appendChild(g);
    m.appendChild(sec);
  });
  // 保險：任何未落入分組的期刊仍要出現
  const rest = r.filter(j=>!GROUPS.some(grp=>grp.match(j)));
  if(rest.length){
    const sec = el("section","gsec");
    sec.innerHTML = `<div class="ghead"><span class="gt">其他</span><span class="gn">${rest.length} 本</span></div>`;
    const g = el("div","grid");
    rest.forEach(j=>g.appendChild(card(j)));
    sec.appendChild(g);
    m.appendChild(sec);
  }
}

      } else if(b.dataset.field){
        goto("browse", {field:[b.dataset.field]});
      } else {
        goto(v);
      }
    };
  });
}

function viewCompare(){
  const m = document.getElementById("main");
  const list = J.filter(j=>S.picked.has(j.id));
  m.innerHTML = "";
  const head = el("div","rhead");
  head.innerHTML = `<span class="rcount">已選 ${list.length} 本</span>
    <span class="hint">回到「期刊總覽」用卡片上的「加入比較」增減 ・ 有差異的欄位會標色</span>`;
  m.appendChild(head);

  if(list.length<2){
    m.appendChild(el("div","empty","<strong>至少選兩本期刊才能比較</strong>回到「期刊總覽」分頁，在卡片右下角點「加入比較」。"));
    return;
  }
  const swipe = el("div","swipe-hint hide","← 表格可左右滑動 →");
  m.appendChild(swipe);
  const wrap = el("div","cmp-wrap");
  const t = el("table","cmp");
  t.innerHTML = `<thead><tr><th>比較項目</th>${list.map(j=>`<th>${esc(j.name)}</th>`).join("")}</tr></thead>`;
  const tb = el("tbody");
  CMP_ROWS.forEach(([label,fn])=>{
    const vals = list.map(fn);
    // 標出「與多數不同」的格子；全部互異時整列都標
    const tally = {}; vals.forEach(v=>tally[v]=(tally[v]||0)+1);
    const top = Math.max(...Object.values(tally));
    const odd = v => Object.keys(tally).length>1 && tally[v] < top;
    const allDiffer = Object.keys(tally).length === vals.length && vals.length>1;
    tb.innerHTML += `<tr><th>${esc(label)}</th>${vals.map(v=>`<td class="${(allDiffer||odd(v))?"diff":""}">${esc(v)}</td>`).join("")}</tr>`;
  });
  t.appendChild(tb);
  wrap.appendChild(t);
  m.appendChild(wrap);
  // 讀 scrollWidth 會強制版面計算，所以同步就量得準。
  // 不用 requestAnimationFrame：分頁在背景時 rAF 會被暫停，提示就不會出現。
  const sizeHint = ()=> swipe.classList.toggle("hide", wrap.scrollWidth <= wrap.clientWidth + 4);
  sizeHint();
  if(window.__cmpResize) removeEventListener("resize", window.__cmpResize);
  window.__cmpResize = sizeHint;
  addEventListener("resize", sizeHint, {passive:true});

  const clr = el("button","reset","清除全部選取");
  clr.type="button"; clr.style.marginTop="14px"; clr.style.maxWidth="180px";
  clr.onclick = ()=>{ S.picked.clear(); render(); };
  m.appendChild(clr);
}

function checklistFor(j){
  const g=[];
  const ok = v => v && !/須查|未載明|未於|^—$/.test(v);
  const fmt=[];
  // 缺資料的項目不能從清單裡消失，否則使用者會以為不必檢查。
  // 一律留一列標成「本站無資料」，這是與待辦並列的第三態。
  const na = label => [`${esc(label)}：<span class="na">本站無資料，請自行對照該刊官網</span>`, "", "na"];
  // 字數欄位可能是「15,000 字為上限，如超過以 20,000 字為原則」這種整句，
  // 所以不能套「控制在 X 以內」的句式，否則會變病句
  if(j.idx!=="SSCI") fmt.push(ok(j.wcZh)
    ? [`中文全文字數符合規定：<span class="v">${esc(j.wcZh)}</span>`, j.wcNote]
    : na("中文全文字數"));
  fmt.push(ok(j.wcEn)
    ? [`${j.idx==="SSCI"?"全文":"英文全文"}字數符合規定：<span class="v">${esc(j.wcEn)}</span>`, j.idx==="SSCI"?j.wcNote:""]
    : na(j.idx==="SSCI"?"全文字數":"英文全文字數"));
  if(j.idx!=="SSCI") fmt.push(ok(j.absZh)
    ? [`中文摘要：<span class="v">${esc(j.absZh)}</span>`,""]
    : na("中文摘要字數"));
  fmt.push(ok(j.absEn)
    ? [`${j.idx==="SSCI"?"摘要":"英文摘要"}：<span class="v">${esc(j.absEn)}</span>`,""]
    : na(j.idx==="SSCI"?"摘要字數":"英文摘要字數"));
  if(j.absNote) fmt.push([esc(j.absNote),""]);
  fmt.push(ok(j.kw)
    ? [`關鍵詞：<span class="v">${esc(j.kw)}</span>${j.kwNote?"，"+esc(j.kwNote):""}`,""]
    : na("關鍵詞數量"));
  fmt.push(ok(j.ref)
    ? [`參考文獻與內文引用一律改為 <span class="v">${esc(j.ref)}</span>`,""]
    : na("參考文獻體例"));
  if(j.layout) fmt.push([esc(j.layout),""]);
  if(j.heads) fmt.push([`標題層級：${esc(j.heads)}`,""]);
  if(fmt.length) g.push(["格式規範", fmt]);

  const anon=[[`確認全文、檔案內容與檔名均無作者姓名、服務單位、計畫編號等可辨識資訊`,""],
              [`自我引用改寫成第三人稱，或暫時匿名處理`,""],
              [`致謝與經費補助說明先移除，待接受刊登後再補`,""]];
  if(j.review) anon.unshift([`審查方式：${esc(j.review)}`,""]);
  g.push(["匿名審查準備", anon]);

  const proc=[];
  if(j.freq) proc.push([`出刊頻率：${esc(j.freq)}`,""]);
  if(j.intake) proc.push([`收稿方式：${esc(j.intake)}`,""]);
  if(j.timeline) proc.push([`預期審查時程：${esc(j.timeline)}`,""]);
  if(j.fee) proc.push([`費用：<span class="v">${esc(j.fee)}</span>。請確認經費來源與核銷方式`,""]);
  if(j.system) proc.push([`於投稿系統註冊並填妥作者資料：${esc(j.system)}`,""]);
  if(j.contact) proc.push([`編輯部聯絡方式備查：${esc(j.contact)}`,""]);
  g.push(["流程與費用", proc]);

  if(j.alerts && j.alerts.length) g.push(["本刊特別要求", j.alerts.map(a=>[esc(a),""])]);

  g.push(["最後一步", [
    ["對照該刊官網現行版稿約，確認以上規定未改版",""],
    ["請未參與研究的同事讀過摘要與標題",""],
    ["確認所有共同作者已同意作者排序與投稿版本",""]
  ]]);
  return g;
}

function viewCheck(){
  const m = document.getElementById("main");
  m.innerHTML = "";
  const pick = el("div","cl-pick");
  const opts = J.slice().sort((a,b)=>a.name.localeCompare(b.name,"zh-Hant"));
  pick.innerHTML = `<label for="clsel" style="font-size:13.5px;color:var(--ink-3)">選一本期刊，產生投稿前檢查清單：</label>
    <select id="clsel"><option value="">— 請選擇 —</option>${opts.map(j=>`<option value="${j.id}"${S.clJournal===j.id?" selected":""}>${esc(j.name)}${j.idx==="SSCI"?"（"+esc(j.tier)+"）":""}</option>`).join("")}</select>`;
  m.appendChild(pick);
  pick.querySelector("#clsel").onchange = e => { S.clJournal = e.target.value; render(); };

  if(!S.clJournal){
    m.appendChild(el("div","empty","<strong>尚未選擇期刊</strong>選定後會依該刊實際規定產生逐項清單，可直接勾選使用。"));
    return;
  }
  const j = J.find(x=>x.id===S.clJournal);
  const sheet = el("div","sheet");
  const v = VLABEL[j.verified];
  let html = `<div class="sheet-head">
      <h2>${esc(j.name)} 投稿前檢查</h2>
      <p>${esc(j.pub)} ・ ${esc(j.idx)}${j.tier?" "+esc(j.tier):""} ・ 資料查證：${v[1]}</p>
    </div>`;
  if(j.status==="suspended")
    html += `<div class="note note-bad" style="margin-bottom:16px"><b>本刊目前暫停接受新投稿</b>
      這份清單仍可以用來準備稿件，但現在投不進去。恢復收稿時間請看該刊官網公告。</div>`;
  let n=0, naCount=0;
  checklistFor(j).forEach(([title,items])=>{
    html += `<div class="cl-group"><h4>${esc(title)}</h4>`;
    items.forEach(([label,sub,kind])=>{
      const detail = sub?`<br><span style="color:var(--ink-4);font-size:12.5px">${esc(sub)}</span>`:"";
      if(kind==="na"){                      // 無資料：不是待辦，不給勾選框
        naCount++;
        html += `<div class="cl-item cl-na"><span class="na-mark">—</span><span>${label}${detail}</span></div>`;
      } else {
        const id = `cl${j.id}_${n++}`;
        html += `<div class="cl-item"><input type="checkbox" id="${id}"><label for="${id}">${label}${detail}</label></div>`;
      }
    });
    html += `</div>`;
  });
  if(naCount) html += `<div class="note"><b>有 ${naCount} 項本站查不到規定</b>　這幾項標成「本站無資料」，意思是本站手上沒有該刊的數字，不是這幾項不用檢查。請直接開該刊官網的稿約確認。</div>`;
  html += `<div class="note" style="margin-top:6px"><b>提醒</b>　本清單依 2026 年 8 月 29 日查證之稿約產生。期刊稿約會改版，送出前請再對照該刊官網現行版本。</div>`;
  sheet.innerHTML = html;
  m.appendChild(sheet);
}

      <li><strong>稿約會改版。</strong>本站查證日期為 2026 年 8 月 29 日。正式投稿前，請以該刊官網當下的版本為準。這裡的資料只用來快速篩選與比較，不能取代官方文件。</li>
      <li><strong>「Q1／Q2」的分區會逐年變動。</strong>本站標示的分區僅供大致定位，實際請以投稿當年度的 JCR 為準；同一本期刊在不同的 category 下分區也可能不同。</li>
      <li><strong>TSSCI 沒有 Q1／Q2。</strong>臺灣的核心期刊制度用的是第一級、第二級（第三級不屬核心期刊），與 JCR 的四分位分區是兩套不同的制度。</li>
      <li><strong>字數的計算範圍各刊不同。</strong>有的含參考文獻與圖表、有的不含；有的同時卡字數與頁數（如《教育心理學報》《測驗學刊》）。看數字時要一併看括號裡的計算方式。</li>
    </ul>

    <h3>期刊怎麼分組的</h3>
    <p>期刊總覽依「索引體系 × 學門」分組，而不是把 52 本排成一片。這樣分是因為<strong>各學門是分開評比的</strong>：同樣掛「第一級」，教育學門與政治學門是兩份互不相干的名單，混在一起看會誤判競爭程度。</p>
    <ul>
      <li><strong>TSSCI 教育學門・第一級</strong>（12 本）與<strong>第二級</strong>（7 本）　2025 年評比，適用至 2028 年底。兩級同屬核心期刊，收錄地位相同。</li>
      <li><strong>TSSCI 心理學門</strong>（7 本）　2024 年評比，含教育心理、輔導諮商與測驗評量。</li>
      <li><strong>TSSCI 社會・政治・管理學門</strong>（7 本）　跨足教育議題時的替代管道。</li>
      <li><strong>SSCI Q1</strong>（16 本）與 <strong>Q2</strong>（2 本）　JCR 四分位。</li>
      <li><strong>非核心・領域相關</strong>（1 本）　《師資培育與教師專業發展期刊》為 2025 年評比第三級，不屬核心期刊，但為國內師資培育少數的專門刊物，所以一併收錄並明確標示。</li>
    </ul>

    <h3>各分頁的用途</h3>
    <ul>
      <li><strong>首頁</strong>　依索引分級或學科領域點進去，會直接帶著篩選條件跳到期刊總覽。</li>
      <li><strong>期刊總覽</strong>　分組排列，左側可再用領域、費用、查證程度縮小範圍。卡片正面就顯示字數、摘要、文獻格式三個最常查的欄位；點卡片看完整規範。</li>
      <li><strong>比較</strong>　在卡片上點「加入比較」選 2 本以上並排，只有與其他期刊不同的欄位會標色。決定要投哪一本時最好用。</li>
      <li><strong>檢查清單</strong>　選定期刊後依該刊實際規定產生逐項清單，可直接勾選。投稿前最後一輪自檢用。</li>
      <li><strong>APA 7</strong>　常用體例速查，含中文期刊特有的在地規範（文獻排序、中文文獻英譯、全形半形標點）。</li>
    </ul>
    <p style="color:var(--ink-4);font-size:13px">鍵盤：按 <code>/</code> 跳到搜尋框，按 <code>Esc</code> 關閉期刊詳情。點左上角刊名回首頁。</p>
  </div>`;
}

/* =====================================================================

function render(){
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute("aria-selected", b.dataset.view===S.view?"true":"false"));

}

// 視圖表開放註冊，讓附加功能住在另一個 <script> 區塊。
// 那個區塊若因舊瀏覽器不支援某個語法而整塊解析失敗，這裡的查詢功能不受影響
// （瀏覽器逐一解析各個 script，而解析錯誤發生在執行之前，能力偵測來不及擋）。
const VIEWS = {home:viewHome, browse:viewBrowse, compare:viewCompare, check:viewCheck, apa:viewApa, about:viewAbout};
window.__app = {
  get S(){ return S; }, get J(){ return J; },
  el, esc, render,
  registerView(key, fn, tabLabel){
    VIEWS[key] = fn;
    if(tabLabel){
      const tabs = document.querySelector('.tabs');
      const b = document.createElement('button');
      b.setAttribute('role','tab'); b.setAttribute('aria-selected','false');
      b.dataset.view = key; b.textContent = tabLabel;
      b.onclick = ()=>{ S.view = key; render(); window.scrollTo({top:0}); };
      tabs.appendChild(b);
    }
  }
};

document.querySelectorAll('.tabs button').forEach(b=>{
  b.onclick = ()=>{ S.view = b.dataset.view; render(); window.scrollTo({top:0,behavior:"instant"}); };
});
document.getElementById("brand").onclick = ()=>{ S.view="home"; render(); window.scrollTo({top:0}); };

// 跨越 1100px 斷點時，篩選欄要在「橫向可收合」與「側欄常駐」之間切換
let wasNarrow = matchMedia("(max-width:1100px)").matches;
addEventListener("resize", ()=>{
  const n = matchMedia("(max-width:1100px)").matches;
  if(n !== wasNarrow){ wasNarrow = n; renderSide(); }
});
const qi = document.getElementById("q");
qi.oninput = e => { S.q = e.target.value; if(S.view!=="browse"&&S.view!=="compare"){S.view="browse";} render(); };
document.getElementById("qclr").onclick = ()=>{ S.q=""; qi.value=""; qi.focus(); render(); };
document.getElementById("scrim").onclick = closeDrawer;
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"){ if(S.open) closeDrawer(); }
  if(e.key==="/" && document.activeElement!==qi){ e.preventDefault(); qi.focus(); }
});

const tb = document.getElementById("theme");
try{
  const saved = localStorage.getItem("tsq-theme");
  if(saved) document.documentElement.setAttribute("data-theme", saved);
}catch(_){}
tb.onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const isDark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  const next = isDark ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try{ localStorage.setItem("tsq-theme", next); }catch(_){}
};

render();
</script>

<script>
/* =====================================================================
   稿件檢查。獨立區塊：這裡若因舊瀏覽器解析失敗，上面的查詢功能不受影響。
   規則一律走 new RegExp 字串建構，避免正則實字在解析階段就讓整塊掛掉。

   這個工具不改稿件，只回報位置。理由寫在介面上：改壞了作者多半不會發現。
   ===================================================================== */
(function(){
"use strict";
const A = window.__app; if(!A) return;
const {esc, el} = A;

/* ---------- 期刊規定的保守解析 ---------- */
const HEDGE = /為原則|原則上|至多|以上為宜|為宜|約\s*[\d,]/;
const num = x => +String(x).replace(/,/g,'');

function parseLimit(raw){
  if(!raw) return {kind:'none'};
  const s = String(raw).trim();
  if(/須查|未載明|未於|依本刊|依投稿|依 |無硬性|無嚴格|^—$/.test(s)) return {kind:'none', raw:s};
  const pagesM = s.match(/(\d+)\s*頁/);
  // 只在「…字／」之後切分。稿件類型的名稱本身可能含斜線（例如
  // 「議題／實務評論」），直接用斜線切會把類型名稱切成兩半。
  const MARK = '@@SEG@@';
  // 切分點是「…字（為宜／為限之類的收尾）／」，不是任意斜線。
  // 稿件類型的名稱本身可能含斜線（「議題／實務評論」），
  // 而「字」與斜線之間也常夾著「為宜」「為限」這類修飾詞。
  const segs = s.replace(/(字(?:為宜|為限|為原則|以內|以下|以上|為上限)?)\s*[／/]\s*/g, '$1' + MARK)
                .split(MARK).map(x=>x.trim()).filter(Boolean);
  const types = segs.map(seg=>{
    const label = seg.replace(/[≤≥<>約]*\s*[\d,]+(\s*[–—~－-]\s*[\d,]+)?\s*字.*$/,'')
                     .replace(/[（(].*$/,'').replace(/[，、,\s≥≤約]+$/,'').trim() || null;
    if(HEDGE.test(seg)) return {label, raw:seg, undecidable:true};
    const r = seg.match(/(\d[\d,]*)\s*[–—~－-]\s*(\d[\d,]*)\s*字/);
    if(r) return {label, min:Math.min(num(r[1]),num(r[2])), max:Math.max(num(r[1]),num(r[2])), raw:seg};
    const lo = seg.match(/[≥>]=?\s*(\d[\d,]*)\s*字|(\d[\d,]*)\s*字以上/);
    if(lo) return {label, min:num(lo[1]||lo[2]), raw:seg};
    const ns = [];
    let mm; const re=/(\d[\d,]*)\s*字/g;
    while((mm=re.exec(seg))!==null) ns.push(num(mm[1]));
    if(!ns.length) return null;
    if(ns.length===1) return {label, max:ns[0], raw:seg};
    return {label, raw:seg, undecidable:true};
  }).filter(Boolean);
  if(!types.length) return {kind: pagesM?'pages':'none', pages: pagesM?+pagesM[1]:null, raw:s};
  return {kind: types.length>1?'byType':'single', types,
          pages: pagesM?+pagesM[1]:null, raw:s,
          undecidable: types.every(t=>t.undecidable)};
}
function parseCount(raw){
  if(!raw) return {kind:'none'};
  const s=String(raw);
  if(/須查|未載明|依本刊|依投稿/.test(s)) return {kind:'none', raw:s};
  const ns=[]; let m; const re=/(\d+)/g;
  while((m=re.exec(s))!==null) ns.push(+m[1]);
  if(!ns.length) return {kind:'none', raw:s};
  return {kind:'range', min: ns.length>1?Math.min.apply(null,ns):null, max:Math.max.apply(null,ns), raw:s};
}

/* ---------- 分段與字數 ---------- */
const HAN_CLASS = '[\\u3400-\\u4dbf\\u4e00-\\u9fff\\uf900-\\ufaff]';
function rx(src, flags){ try{ return new RegExp(src, flags); }catch(e){ return null; } }
const HAN_G = rx(HAN_CLASS, 'g');

function splitSections(text){
  const out={abstractZh:'', keywords:'', body:'', refs:''};
  const refM = text.match(/\n\s*(參考文獻|References|REFERENCES)\s*\n/);
  out.refs = refM ? text.slice(refM.index) : '';
  const head = refM ? text.slice(0, refM.index) : text;
  const abM = head.match(/\n\s*(摘\s*要|中文摘要)\s*\n/);
  const kwM = head.match(/\n\s*(關鍵詞|關鍵字)\s*[：:]/);
  if(abM && kwM && kwM.index > abM.index){
    out.abstractZh = head.slice(abM.index+abM[0].length, kwM.index).trim();
    // kwM.index 指向那一行前面的換行字元，要先跳過空白才切得到整行，
    // 否則 split('\n')[0] 會拿到換行前的空字串，關鍵詞就變成「找不到」
    let s0 = kwM.index;
    while(s0 < head.length && /\s/.test(head.charAt(s0))) s0++;
    out.keywords = head.slice(s0).split('\n')[0];
    out.body = head.slice(s0 + out.keywords.length);
  } else out.body = head;
  return out;
}
function tally(t){
  const zh = HAN_G ? (t.match(HAN_G)||[]).length : 0;
  const punct=(t.match(/[，。、；：！？（）「」『』《》〈〉]/g)||[]).length;
  const en=(t.match(/[A-Za-z][A-Za-z'-]*/g)||[]).length;
  const nu=(t.match(/\d[\d,.]*/g)||[]).length;
  return {zh, punct, en, num:nu, total: zh+punct+en+nu};
}
function countWords(text){
  const s=splitSections(text);
  return {sections:s, body:tally(s.body), refs:tally(s.refs),
          abstractZh:tally(s.abstractZh), all:tally(text)};
}

/* ---------- 保護區：這些區段不套中文文字規則 ---------- */
function protectedZones(text){
  const z=[]; const add=(a,b,why)=>{ if(b>a) z.push({a,b,why}); }; let m;
  const refM=text.match(/\n\s*(參考文獻|References|REFERENCES)\s*\n/);
  if(refM) add(refM.index, text.length, '參考文獻');
  const ab=text.match(/\n\s*Abstract\s*\n/);
  if(ab){ const rest=text.slice(ab.index+ab[0].length);
    const e=rest.search(/\n\s*(Keywords?|關鍵詞|壹|一、)/);
    add(ab.index, ab.index+ab[0].length+(e<0?rest.length:e), '英文摘要'); }
  const ap=text.match(/\n\s*(附錄|Appendix)/);
  if(ap) add(ap.index, text.length, '附錄');
  const q=/[「『]([^」』]{4,})[」』]/g;
  while((m=q.exec(text))!==null) add(m.index, m.index+m[0].length, '引文');
  const u=/(https?:\/\/\S+|10\.\d{4,}\/\S+|[\w.+-]+@[\w.-]+\.\w+)/g;
  while((m=u.exec(text))!==null) add(m.index, m.index+m[0].length, '網址或 DOI');
  let at=0;
  text.split('\n').forEach(line=>{
    const han=(HAN_G?(line.match(HAN_G)||[]).length:0);
    if(/[;{}]|<-|\bdata\s*=|\bmodel\s*=/.test(line) && /[A-Za-z]/.test(line) && han<3)
      add(at, at+line.length, '程式碼或統計語法');
    // 數學式：像「SE差異 = √(SE₁² + SE₂²)」這種，下標變數名本來就不該補空格
    else if(/[√∑∏∫≈≠≤≥±×÷]/.test(line) || (/\s=\s/.test(line) && /[²³⁴₀₁₂₃₄₅₆₇₈₉]/.test(line)))
      add(at, at+line.length, '數學式');
    at += line.length+1;
  });
  return z.sort((x,y)=>x.a-y.a);
}
const inZone=(z,i)=>z.some(x=>i>=x.a && i<x.b);
const maskEnglish = t => t.replace(/[A-Za-z][A-Za-z0-9\s,.;:'"()&/-]{6,}/g, s=>' '.repeat(s.length));

/* ---------- 文字規則：只回報位置，不改字 ---------- */
const RULES = [
  {id:'comma',  src:HAN_CLASS+'\\s?,\\s?'+HAN_CLASS, zh:true, msg:'中文之間用了半形逗號', fix:'全形，'},
  {id:'semi',   src:HAN_CLASS+'\\s?;\\s?'+HAN_CLASS, zh:true, msg:'中文之間用了半形分號', fix:'全形；'},
  {id:'colon',  src:HAN_CLASS+'\\s?:\\s?'+HAN_CLASS, zh:true, msg:'中文之間用了半形冒號', fix:'全形：'},
  // 「註.」「表.」「圖.」是圖表註解的標記，不是句尾標點，命中要放掉
  {id:'period', src:HAN_CLASS+'\\.(?![0-9A-Za-z])',  zh:true, msg:'中文後面接了半形句點', fix:'全形。',
   skipIf:function(hit){ return '註表圖式例'.indexOf(hit.charAt(0)) >= 0; }},
  {id:'paren',  src:HAN_CLASS+'\\((?![A-Za-z0-9])',  zh:true, msg:'中文後面接了半形左括號', fix:'全形（'},
  {id:'ellip',  src:'\\.\\.\\.',                      zh:true, msg:'用三個半形句點當刪節號', fix:'……', raw:true},
  {id:'etal1',  src:'\\bet\\s+al(?!\\.)\\b',          msg:'et al 少了句點', fix:'et al.'},
  {id:'etal2',  src:'\\bet\\.\\s?al\\.',              msg:'et.al. 多了一個句點', fix:'et al.'},
  {id:'p0',     src:'\\bp\\s?[=<>]\\s?0\\.\\d+',      msg:'p 值的小數點前不寫 0', fix:'刪掉那個 0'},
  {id:'eta0',   src:'(η2|η²)\\s?[=<>]\\s?0\\.\\d+',   msg:'η² 的小數點前不寫 0', fix:'刪掉那個 0'},
  {id:'doi',    src:'\\bdoi:\\s?10\\.', flags:'gi',   msg:'APA 第 7 版的 DOI 要寫成完整網址', fix:'https://doi.org/10.…', raw:true},
  {id:'space',  src:'('+HAN_CLASS+')([A-Za-z0-9])|([A-Za-z0-9])('+HAN_CLASS+')', msg:'中文與英數之間少了半形空格', fix:'補一個半形空格'}

function runRules(text, opts){
  opts = opts || {};
  const zones = protectedZones(text);
  const masked = maskEnglish(text);
  const hits = [];
  const skipped = [];
  for(const r of RULES){
    if(r.zh && opts.skipZh){ skipped.push(r.msg); continue; }
    const re = rx(r.src, r.flags || 'g');
    if(!re){ skipped.push(r.msg + '（這個瀏覽器不支援，已停用）'); continue; }
    const src = r.raw ? text : (r.zh ? masked : text);
    let m; re.lastIndex = 0;
    while((m = re.exec(src)) !== null){
      if(m[0].length === 0){ re.lastIndex++; continue; }
      if(!r.raw && inZone(zones, m.index)) continue;
      if(r.skipIf && r.skipIf(text.substr(m.index, m[0].length))) continue;
      hits.push({at:m.index, msg:r.msg, fix:r.fix, hit:text.substr(m.index, m[0].length),
        near: text.substr(Math.max(0, m.index-16), m[0].length+32).replace(/\n/g,' ').trim()});
    }

/* ---------- 匿名審查 ---------- */
function anonymityScan(text, meta){
  meta = meta || {}; const out=[];
  const P=[[/本研究(?:由|獲|承)[^\n。]{0,24}(?:補助|經費|支持|計畫)/g,'經費補助說明'],
           [/(?:MOST|NSTC|NSC)\s?[\d-]{6,}/g,'計畫編號'],
           [/(?:誌謝|致謝|謝辭)/g,'致謝段落']];

    while((m=re.exec(text))!==null) out.push({what, where:'正文', detail:m[0]}); }
  if(meta.creator) out.push({what:'Word 檔案內容資訊裡的作者', where:'docProps/core.xml', detail:meta.creator, name:true});
  if(meta.lastModifiedBy) out.push({what:'Word 檔案的最後修改者', where:'docProps/core.xml', detail:meta.lastModifiedBy, name:true});
  if(meta.company) out.push({what:'Word 檔案裡的單位名稱', where:'docProps/app.xml', detail:meta.company, name:true});
  if(meta.hasComments) out.push({what:'文件裡還留著審閱註解', where:'word/comments.xml', detail:'請在 Word 中刪除全部註解'});
  if(meta.hasTracked) out.push({what:'文件裡還有未處理的追蹤修訂', where:'document.xml', detail:'請全部接受或拒絕後再存檔'});
  if(meta.headerFooter) out.push({what:'頁首或頁尾有文字', where:'header/footer', detail:meta.headerFooter});
  return out;
}
function maskName(s){
  const t=String(s||'').trim();
  if(!t) return t;
  const isHan = rx('^'+HAN_CLASS+'{2,4}$');
  if(isHan && isHan.test(t)) return t.charAt(0) + '○'.repeat(t.length-1);
  return t.length<=2 ? t.charAt(0)+'○' : t.slice(0,2)+'○'.repeat(Math.min(4,t.length-2));
}

/* ---------- 三態判定：永遠不輸出「通過」 ---------- */
function judge(actual, t){
  if(!t || t.undecidable) return {state:'unknown'};
  if(t.max == null && t.min == null) return {state:'unknown'};
  if(t.min != null && actual < t.min)
    return {state:'under', why:'低於下限 '+t.min.toLocaleString()+' 字'};
  if(t.max == null) return {state:'within', why:'已達下限'};
  const over = actual - t.max;
  if(Math.abs(over)/t.max <= 0.05)
    return {state:'borderline', why:'與上限相差在 5% 以內，請以 Word 的字數統計為準'};
  return over>0 ? {state:'over', why:'超出上限約 '+over.toLocaleString()+' 字'}
                : {state:'within', why:'距上限還有約 '+(-over).toLocaleString()+' 字'};
}

/* ---------- .docx 讀取（原生 API，不引函式庫） ---------- */
let CAN_DOCX = false;
try { new DecompressionStream('deflate-raw'); CAN_DOCX = true; } catch(e){}

// 讀 zip 時把每個 entry 的原始壓縮位元組留著。
// 之後重打包時，沒改到的 entry 直接複製這段位元組，連解壓都不做，
// 圖片、註腳、方程式、文獻管理軟體的欄位因此不可能在過程中受損。
async function zipOpen(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eocd=-1, lim=Math.max(0, u8.length-65558);
  for(let i=u8.length-22; i>=lim; i--) if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; }
  if(eocd<0) throw new Error('這不像是 Word 檔。舊版 .doc 或 Pages 檔請先在 Word 另存為 .docx。');
  const n=dv.getUint16(eocd+10,true);
  if(n===0xFFFF) throw new Error('這個檔案用了 ZIP64 格式，本工具讀不了。');
  let p=dv.getUint32(eocd+16,true);
  const map=new Map(), list=[], dec=new TextDecoder();
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error('檔案結構讀不下去，可能已損毀。');
    const method=dv.getUint16(p+10,true);
    const mtime=dv.getUint16(p+12,true), mdate=dv.getUint16(p+14,true);
    const crc=dv.getUint32(p+16,true);
    const csize=dv.getUint32(p+20,true), usize=dv.getUint32(p+24,true);
    const nlen=dv.getUint16(p+28,true), elen=dv.getUint16(p+30,true), clen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=dec.decode(u8.subarray(p+46,p+46+nlen));
    const lnlen=dv.getUint16(lho+26,true), lelen=dv.getUint16(lho+28,true);
    const start=lho+30+lnlen+lelen;
    const e={name, method, crc, csize, usize, mtime, mdate, raw:u8.subarray(start, start+csize)};
    map.set(name, e); list.push(e);
    p += 46+nlen+elen+clen;
  }
  return {dv,u8,map,list};
}
async function zipText(z, name){
  const e=z.map.get(name); if(!e) return null;
  if(e.method===0) return new TextDecoder().decode(e.raw);
  if(e.method!==8) throw new Error('不支援的壓縮方式。');
  const s=new Blob([e.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return await new Response(s).text();
}

/* ---------- 重打包：只置換改過的 part，其餘照抄 ---------- */
const CRC32 = (function(){
  const t=new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[i]=c>>>0; }
  return function(b){ let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=t[(c^b[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
})();
async function zipWrite(list){
  const enc=new TextEncoder(), parts=[], central=[];
  let off=0;
  for(const e of list){
    let method=e.method, crc=e.crc, csize=e.csize, usize=e.usize, raw=e.raw;
    if(e.replaceWith !== undefined){
      const data=enc.encode(e.replaceWith);
      const s=new Blob([data]).stream().pipeThrough(new CompressionStream('deflate-raw'));
      raw=new Uint8Array(await new Response(s).arrayBuffer());
      method=8; crc=CRC32(data); csize=raw.length; usize=data.length;
    }
    const nm=enc.encode(e.name);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0,true);
    lh.setUint16(8,method,true); lh.setUint16(10,e.mtime,true); lh.setUint16(12,e.mdate,true);
    lh.setUint32(14,crc,true); lh.setUint32(18,csize,true); lh.setUint32(22,usize,true);
    lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer), nm, raw);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0,true); ch.setUint16(10,method,true);
    ch.setUint16(12,e.mtime,true); ch.setUint16(14,e.mdate,true);
    ch.setUint32(16,crc,true); ch.setUint32(20,csize,true); ch.setUint32(24,usize,true);
    ch.setUint16(28,nm.length,true); ch.setUint32(42,off,true);
    central.push(new Uint8Array(ch.buffer), nm);
    off += 30+nm.length+csize;
  }
  let clen=0; central.forEach(c=>clen+=c.length);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);
  eo.setUint16(8,list.length,true); eo.setUint16(10,list.length,true);
  eo.setUint32(12,clen,true); eo.setUint32(16,off,true);
  return new Blob([...parts,...central,new Uint8Array(eo.buffer)],
    {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}

const TW = cm => Math.round(cm*567);
function patchSectPr(xml, o){
  const sects = xml.match(/<w:sectPr[\s\S]*?<\/w:sectPr>|<w:sectPr[^>]*\/>/g) || [];
  const pgSz = '<w:pgSz w:w="11906" w:h="16838"/>';
  const pgMar = '<w:pgMar w:top="'+TW(o.top)+'" w:right="'+TW(o.right)+'" w:bottom="'+TW(o.bottom)+
                '" w:left="'+TW(o.left)+'" w:header="851" w:footer="992" w:gutter="0"/>';
  let out = xml;
  for(const s of sects){
    let t = s;
    t = /<w:pgSz[^>]*\/>/.test(t) ? t.replace(/<w:pgSz[^>]*\/>/, pgSz)
                                  : t.replace(/(<w:sectPr[^>]*>)/, '$1'+pgSz);
    t = /<w:pgMar[^>]*\/>/.test(t) ? t.replace(/<w:pgMar[^>]*\/>/, pgMar)
                                   : t.replace(/(<w:pgSz[^>]*\/>)/, '$1'+pgMar);
    out = out.replace(s, t);
  }
  return {xml:out, sections:sects.length};
}
function patchDocDefaults(xml, o){
  const rF = '<w:rFonts w:ascii="'+o.enFont+'" w:hAnsi="'+o.enFont+'" w:eastAsia="'+o.zhFont+'" w:cs="'+o.enFont+'"/>';
  const sz = '<w:sz w:val="'+(o.size*2)+'"/><w:szCs w:val="'+(o.size*2)+'"/>';
  const sp = '<w:spacing w:line="'+o.line+'" w:lineRule="auto" w:before="0" w:after="0"/>';
  const dd = '<w:docDefaults><w:rPrDefault><w:rPr>'+rF+sz+'</w:rPr></w:rPrDefault>'+
             '<w:pPrDefault><w:pPr>'+sp+'</w:pPr></w:pPrDefault></w:docDefaults>';
  if(/<w:docDefaults>[\s\S]*?<\/w:docDefaults>/.test(xml))
    return xml.replace(/<w:docDefaults>[\s\S]*?<\/w:docDefaults>/, dd);
  return xml.replace(/(<w:styles[^>]*>)/, '$1'+dd);
}
// 清掉文中手動設定的字型與字級，讓上面的預設真的生效。
// 只動字型與字級，粗體、斜體、底線、顏色、對齊一概不碰。
function stripRunFonts(xml){
  let n=0;
  const bump = ()=>{ n++; return ''; };
  const out = xml.replace(/<w:rFonts[^>]*\/>/g, bump)
                 .replace(/<w:sz w:val="[^"]*"\s*\/>/g, bump)
                 .replace(/<w:szCs w:val="[^"]*"\s*\/>/g, bump);
  return {xml:out, removed:n};
}
function stripParaSpacing(xml){
  let n=0;
  const out = xml.replace(/<w:spacing[^>]*w:line="[^"]*"[^>]*\/>/g, ()=>{ n++; return ''; });
  return {xml:out, removed:n};
}
const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
function paragraphsOf(xml){
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('Word 檔的內容解析失敗。');
  const out=[];
  const ps=doc.getElementsByTagNameNS(W,'p');
  for(let i=0;i<ps.length;i++){
    const p=ps[i]; let text='';
    // 跳過 instrText（Zotero、EndNote 的欄位碼）與 delText（已刪除的追蹤修訂）
    const walk=node=>{
      for(let c=node.firstChild;c;c=c.nextSibling){
        if(c.nodeType!==1) continue;
        const n=c.localName;
        if(n==='instrText'||n==='delText'||n==='del'||n==='rPr'||n==='pPr') continue;
        if(n==='t') text += c.textContent;
        else if(n==='tab') text += '\t';
        else if(n==='br'||n==='cr') text += '\n';
        else walk(c);
      }
    };
    walk(p);
    out.push(text);
  }
  return out;
}
async function readDocx(file){
  const z = await zipOpen(await file.arrayBuffer());
  const docXml = await zipText(z,'word/document.xml');
  if(!docXml) throw new Error('這是一個壓縮檔，但裡面沒有 Word 的內容。');
  let text = paragraphsOf(docXml).join('\n');
  // 註腳與尾註：有些期刊的字數明文含註腳
  let notes='';
  for(const nm of ['word/footnotes.xml','word/endnotes.xml']){
    const x = await zipText(z,nm).catch(()=>null);
    if(x) notes += paragraphsOf(x).join('\n')+'\n';
  }
  // 頁首頁尾常常留著服務單位
  let hf='';
  for(const k of z.map.keys())
    if(/^word\/(header|footer)\d*\.xml$/.test(k)){
      const x=await zipText(z,k).catch(()=>null);
      if(x) hf += paragraphsOf(x).join(' ').trim()+' ';
    }
  const core = await zipText(z,'docProps/core.xml').catch(()=>null);
  const app  = await zipText(z,'docProps/app.xml').catch(()=>null);
  const pick=(xml,tag)=>{ if(!xml) return ''; const m=xml.match(new RegExp('<'+tag+'[^>]*>([^<]*)</'+tag+'>')); return m?m[1].trim():''; };
  const zot = /ZOTERO_ITEM|ADDIN EN\.CITE|CITAVI|MENDELEY/.test(docXml);
  const sectCount = (docXml.match(/<w:sectPr/g) || []).length;
  return {
    text, notes: notes.trim(), zip:z, sectCount,
    entryCount: z.list.length,
    mediaCount: z.list.filter(e=>/^word\/media\//.test(e.name)).length,
    meta:{
      creator: pick(core,'dc:creator'),
      lastModifiedBy: pick(core,'cp:lastModifiedBy'),
      company: pick(app,'Company'),
      hasComments: z.map.has('word/comments.xml'),
      hasTracked: /<w:ins[\s>]|<w:del[\s>]/.test(docXml),
      headerFooter: hf.trim().slice(0,80),
      refManager: zot
    }
  };
}

/* ---------- 從期刊的 layout 原文抽出版面數字 ----------
   抽不到的欄位一律留空，介面上標「本刊未載明」讓使用者自己填，不猜。 */
function parseLayout(raw){
  const o = {top:null,bottom:null,left:null,right:null,zhFont:null,enFont:null,size:null,line:null, found:[]};
  if(!raw) return o;
  const s = String(raw);
  let m;
  m = s.match(/上下[^\d]{0,6}([\d.]+)\s*(?:公分|cm)/);
  if(m){ o.top=o.bottom=+m[1]; o.found.push('上下邊界'); }
  m = s.match(/左右[^\d]{0,6}([\d.]+)\s*(?:公分|cm)/);
  if(m){ o.left=o.right=+m[1]; o.found.push('左右邊界'); }
  m = s.match(/上下左右[^\d]{0,6}([\d.]+)\s*(?:公分|cm)/);
  if(m){ o.top=o.bottom=o.left=o.right=+m[1]; o.found.push('四邊邊界'); }
  m = s.match(/(新細明體|標楷體|細明體|微軟正黑體|Times New Roman)/);
  if(/新細明體|標楷體|細明體|微軟正黑體/.test(s)){
    o.zhFont = (s.match(/(新細明體|標楷體|細明體|微軟正黑體)/)||[])[1]; o.found.push('中文字型');
  }
  if(/Times New Roman/.test(s)){ o.enFont='Times New Roman'; o.found.push('英文字型'); }
  m = s.match(/內文[^\d]{0,8}(\d{1,2})\s*(?:級|號)|(\d{1,2})\s*(?:級|號)字?體?[^）]{0,4}(?:內文)?/);
  const sizeM = s.match(/內文[^\d]{0,8}(\d{1,2})\s*[級號]/) || s.match(/(\d{1,2})\s*[級號](?:字體?)?/);
  if(sizeM){ o.size = +(sizeM[1]||sizeM[2]); o.found.push('字級'); }
  if(/單行間距/.test(s)){ o.line=240; o.found.push('行距'); }
  else if(/1\.5\s*倍/.test(s)){ o.line=360; o.found.push('行距'); }
  else if(/雙行間距|２倍|2\s*倍/.test(s)){ o.line=480; o.found.push('行距'); }
  return o;
}
const LINE_LABEL = {240:'單行間距', 360:'1.5 倍行高', 480:'2 倍行高'};

const St = { jid:'', typeIdx:0, lang:'zh', text:'', src:'', meta:null, err:'', doc:null,

/* 存檔有兩條路：
   一般網頁（GitHub Pages）用 <a download>；
   Artifact 檢視器封鎖頁面自行下載，要走它的 downloads 能力，由檢視者確認後才存。 */
const IN_ARTIFACT = (function(){
  try{ return typeof window.claude !== 'undefined' && typeof window.claude.use === 'function'; }
  catch(e){ return false; }
})();
let DL = null, DL_SETTLED = !IN_ARTIFACT;
if(IN_ARTIFACT){
  window.claude.use('downloads').then(function(d){
    DL = d; DL_SETTLED = true;
    if(A.S.view === 'lint') A.render();     // 能力晚到，補畫一次按鈕
  }).catch(function(){ DL_SETTLED = true; if(A.S.view==='lint') A.render(); });
}
const canSave = () => IN_ARTIFACT ? !!DL : true;

async function saveFile(blob, name){
  if(IN_ARTIFACT){
    if(!DL) throw new Error('這個檢視環境不提供存檔。');
    await DL.save({filename:name, data:blob});   // Blob 是複製的，原物件不會被清空
    return;
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function report(j, L, multi){
  const text = St.text;
  const wc = countWords(text);
  const t = L.wc.kind==='byType' ? L.wc.types[St.typeIdx] : (L.wc.types && L.wc.types[0]);
  const scopeRefs = j.wcNote && /參考文獻/.test(j.wcNote);
  const used = scopeRefs ? wc.all.total : wc.body.total + wc.abstractZh.total;
  const jd = judge(used, t);
  const skipZh = L.isEn || (wc.all.zh / Math.max(1, wc.all.total)) < 0.1;
  const rules = runRules(text, {skipZh});
  const anon = anonymityScan(text, St.meta || {});
  const unchecked = [];

  let h = '<section class="lint-report">';
  h += `<h3>檢查結果</h3>`;
  if(j.status==="suspended")
    h += `<div class="note note-bad"><b>本刊目前暫停接受新投稿</b>
      下面的檢查照跑，但現在投不進去。恢復收稿時間請看該刊官網公告。</div>`;

  // 字數
  h += `<div class="rblock"><h4>字數</h4>`;
  if(L.wc.pages){
    h += `<div class="note note-bad"><b>本刊以頁數為最終標準</b>　規定為 ${L.wc.pages} 頁（含圖表與空白版面）。
      頁數在瀏覽器裡算不出來，請務必在 Word 裡自行確認。以下字數僅供參考，不代表通過。</div>`;
    unchecked.push('頁數上限（'+L.wc.pages+' 頁）。瀏覽器算不出頁數，請在 Word 裡確認。');
  }
  if(L.wc.kind==='none'){
    h += `<div class="verdict b-na">無法檢查<span>本站沒有這本期刊的字數規定</span></div>`;
    unchecked.push('全文字數。本站沒有這本期刊的數字，請自行對照官網。');
  } else if(L.wc.kind==='pages'){
    h += `<div class="verdict b-na">不做判定<span>本刊以頁數為準，沒有字數上限可比對</span></div>`;
    unchecked.push('全文字數。本刊以頁數為準，沒有字數規定可以比對。');
  } else if(!t || t.undecidable){
    h += `<div class="verdict b-na">不做判定<span>本刊規定寫成「${esc((t&&t.raw)||L.wc.raw)}」，一句話裡有兩個數字，本站不替你選一個</span></div>`;
    unchecked.push('全文字數。本刊的規定一句話裡有兩個數字，本站不做判定，請自行認定。');
  } else {
    const [cls,label]=badge(jd.state);
    h += `<div class="verdict ${L.wc.pages?'b-warn':cls}">${esc(label)}<span>${esc(jd.why||'')}</span></div>`;
  }
  h += `<table class="wtab"><tbody>
     <tr><th>摘要</th><td>${wc.abstractZh.total.toLocaleString()} 字</td><td class="muted">${wc.sections.abstractZh?'':'（找不到摘要段落）'}</td></tr>
     <tr><th>正文</th><td>${wc.body.total.toLocaleString()} 字</td><td class="muted"></td></tr>
     <tr><th>參考文獻</th><td>${wc.refs.total.toLocaleString()} 字</td><td class="muted">${wc.sections.refs?'':'（找不到參考文獻段落）'}</td></tr>
     <tr class="sum"><th>本次比對用</th><td>${used.toLocaleString()} 字</td><td class="muted">${scopeRefs?'依本刊規定，已含參考文獻':'依本刊規定，未含參考文獻'}</td></tr>
     </tbody></table>
     <p class="muted">中文字數各家算法不同，全形標點算不算就差約一成。這裡的數字只能當估計，接近上限時請以 Word 的字數統計為準。
     建議第一次使用先拿一份稿子跟 Word 對一次，確認口徑相同。</p></div>`;

  // 摘要與關鍵詞
  h += `<div class="rblock"><h4>摘要與關鍵詞</h4>`;
  const abT = L.ab.types && L.ab.types[L.ab.kind==='byType' ? Math.min(St.typeIdx, L.ab.types.length-1) : 0];
  if(L.ab.kind==='none'){ h += `<div class="verdict b-na">摘要無法檢查<span>本站沒有這本期刊的摘要規定</span></div>`;
    unchecked.push('摘要字數。本站沒有這本期刊的數字。'); }
  else if(!wc.sections.abstractZh){ h += `<div class="verdict b-na">摘要無法定位<span>找不到「摘要」到「關鍵詞：」之間的段落，沒有猜</span></div>`;
    unchecked.push('摘要字數。稿件裡找不到摘要段落，無法比對。'); }
  else { const aj=judge(wc.abstractZh.total, abT); const [c,l]=badge(aj.state);
    h += `<div class="verdict ${c}">摘要 ${esc(l)}<span>${wc.abstractZh.total} 字，本刊規定 ${esc(L.ab.raw)}</span></div>`; }
  const kwLine = wc.sections.keywords || '';
  if(L.kw.kind==='none'){ h += `<div class="verdict b-na">關鍵詞無法檢查<span>本站沒有這本期刊的規定</span></div>`;
    unchecked.push('關鍵詞個數。本站沒有這本期刊的數字。'); }
  else if(!kwLine){ h += `<div class="verdict b-na">關鍵詞無法定位<span>找不到「關鍵詞：」開頭的一行</span></div>`;
    unchecked.push('關鍵詞個數。稿件裡找不到關鍵詞那一行。'); }
  else {
    const n = kwLine.replace(/^[^：:]*[：:]/,'').split(/[、,，;；]/).map(s=>s.trim()).filter(Boolean).length;
    const okKw = (L.kw.max==null || n<=L.kw.max) && (L.kw.min==null || n>=L.kw.min);
    h += `<div class="verdict ${okKw?'b-okish':'b-over'}">關鍵詞 ${n} 個<span>本刊規定 ${esc(L.kw.raw)}</span></div>`;
  }
  h += `</div>`;

  // 格式問題
  h += `<div class="rblock"><h4>格式問題　<span class="muted">${skipZh?'（本刊為英文稿，中文標點規則已停用）':''}</span></h4>`;
  if(!j.ref || !/APA/.test(j.ref||''))
    h += `<div class="note note-bad"><b>本刊採用「${esc(j.ref||'本站無資料')}」</b>　以下只是 APA 第 7 版的通用檢查，不代表符合本刊體例。請直接看該刊稿約。</div>`;
  if(St.meta && St.meta.refManager)
    h += `<div class="note"><b>你的引用由文獻管理軟體產生</b>　請在 Zotero 或 EndNote 的樣式設定裡改，直接改文字不會生效。</div>`;
  if(rules.zones.length)
    h += `<p class="muted">已略過 ${rules.zones.length} 個區段不做文字檢查：${[...new Set(rules.zones.map(z=>z.why))].join('、')}。引文與參考文獻裡的寫法不該被自動判定為錯。</p>`;
  if(!rules.hits.length){
    h += `<p class="muted">這幾條規則沒有發現問題。這不等於格式正確，只代表這幾項自動檢查沒有命中。</p>`;
  } else {
    const grouped = {};
    rules.hits.forEach(x=>{ (grouped[x.msg]=grouped[x.msg]||[]).push(x); });
    h += `<div class="hits">`;
    Object.keys(grouped).forEach(k=>{
      const g=grouped[k];
      h += `<div class="hitgrp"><div class="hithead">${esc(k)}<span>${g.length} 處</span>
        <em>在 Word 裡改成：${esc(g[0].fix)}</em></div>`;
      g.slice(0,6).forEach(x=>h += `<div class="hitline"><code>${esc(x.near)}</code></div>`);
      if(g.length>6) h += `<div class="muted" style="padding:2px 10px">還有 ${g.length-6} 處</div>`;
      h += `</div>`;
    });
    h += `</div>`;
  }
  if(rules.skipped.length) unchecked.push('以下規則本次未執行：'+rules.skipped.join('、'));
  h += `</div>`;

  // 匿名審查
  h += `<div class="rblock"><h4>匿名審查殘留</h4>`;
  if(!St.meta) unchecked.push('Word 檔案內嵌的作者資訊、審閱註解與追蹤修訂。貼上純文字看不到這些，要上傳 .docx 才驗得到。');
  if(!anon.length){
    h += `<p class="muted">已掃過${St.meta?'正文、檔案內容資訊、頁首頁尾、註解與追蹤修訂':'正文'}，沒有命中。
      這不等於已完成匿名化：圖片內容、圖片的 EXIF、檔名、以及截圖裡的資料夾路徑本工具都看不到。</p>`;
  } else {
    h += `<div class="anon">${anon.map(x=>
      `<div class="anonline"><b>${esc(x.what)}</b><code>${esc(x.name?maskName(x.detail):x.detail)}</code><span class="muted">${esc(x.where)}</span></div>`
    ).join('')}</div>
    <p class="muted">姓名已遮蔽顯示。檔案內容資訊那幾項在 Word 的「檔案 → 資訊 → 檢查文件」裡清除。</p>`;
  }
  unchecked.push('圖片內容、圖片 EXIF、檔名本身、截圖裡的路徑。這些本工具看不到。');
  h += `</div>`;

  // 版面設定：可直接套用到原檔
  const P = parseLayout(j.layout);
  const D = {
    top:   P.top    != null ? P.top    : 2.54,
    bottom:P.bottom != null ? P.bottom : 2.54,
    left:  P.left   != null ? P.left   : 3.18,
    right: P.right  != null ? P.right  : 3.18,
    zhFont:P.zhFont || '新細明體',
    enFont:P.enFont || 'Times New Roman',
    size:  P.size   != null ? P.size   : 12,
    line:  P.line   != null ? P.line   : 240
  };
  h += `<div class="rblock"><h4>套用版面到你的 Word 檔</h4>`;
  if(j.layout) h += `<div class="layoutbox">${esc(j.layout)}</div>`;
  if(j.heads)  h += `<div class="layoutbox">標題層級：${esc(j.heads)}</div>`;
  if(!j.layout){
    h += `<div class="verdict b-na">本刊版面規定本站無資料<span>以下數字是通用預設值，請自行對照該刊稿約修改</span></div>`;
    unchecked.push('版面設定。本站沒有收錄這本期刊的版面規定，表單裡是通用預設值。');
  } else if(P.found.length){
    h += `<p class="muted">已從上面的規定讀出：${P.found.join('、')}。其餘欄位是通用預設值，請自行核對。</p>`;
  }
  h += `<div class="fmtgrid">
      <label>上邊界 <input type="number" step="0.01" id="f-top" value="${D.top}"><span>cm</span></label>
      <label>下邊界 <input type="number" step="0.01" id="f-bottom" value="${D.bottom}"><span>cm</span></label>
      <label>左邊界 <input type="number" step="0.01" id="f-left" value="${D.left}"><span>cm</span></label>
      <label>右邊界 <input type="number" step="0.01" id="f-right" value="${D.right}"><span>cm</span></label>
      <label>中文字型 <input type="text" id="f-zh" value="${esc(D.zhFont)}"></label>
      <label>英文字型 <input type="text" id="f-en" value="${esc(D.enFont)}"></label>
      <label>字級 <input type="number" step="0.5" id="f-size" value="${D.size}"><span>級</span></label>
      <label>行距 <select id="f-line">
        <option value="240"${D.line===240?' selected':''}>單行間距</option>
        <option value="360"${D.line===360?' selected':''}>1.5 倍行高</option>
        <option value="480"${D.line===480?' selected':''}>2 倍行高</option>
      </select></label>
    </div>
    <div class="fmtopts">
      <label><input type="checkbox" id="o-strip" checked>
        <span><b>清除文中手動設定的字型與字級</b>，讓上面的設定真的生效。
        中文論文多半是逐段手動設字型的，不清的話新設定會被蓋掉。
        粗體、斜體、底線、顏色、對齊、縮排都不會動到。</span></label>
      <label><input type="checkbox" id="o-line">
        <span><b>一併統一行距</b>。會清掉段落層級的行距設定，包括你為了排版特意調過的段落。
        不確定就不要勾。</span></label>
    </div>`;
  if(!St.doc){
    h += `<div class="note"><b>要套用版面，請用上傳 Word 檔的方式提供稿件</b>　貼上純文字只有字，沒有版面可以改。</div>`;
  } else if(St.doc.sectCount > 1){
    h += `<div class="note note-bad"><b>這份文件有 ${St.doc.sectCount} 個章節設定</b>
      通常表示中間有橫向頁面或不同的頁面配置（例如放大表格那幾頁）。
      全部套用同一組邊界會把那些頁面弄壞，所以這份檔案不提供自動套用，請在 Word 裡逐節處理。</div>`;
  } else if(!DL_SETTLED){
    h += `<div class="note"><span class="muted">正在確認這個環境能不能存檔…</span></div>`;
  } else if(!canSave()){
    h += `<div class="note"><b>這個檢視環境不提供存檔</b>
      請改用 <a href="https://ian3738.github.io/journal-format-lookup/" target="_blank" rel="noopener">GitHub Pages 版</a>，
      功能相同且可以直接存下檔案。</div>`;
  } else {
    h += `<button class="runbtn" id="fmtBtn"${St.busy?' disabled':''}>${St.busy?'處理中…':'套用版面並下載'}</button>`;
    if(St.fmtMsg) h += `<div class="note note-ok" style="margin-top:10px">${St.fmtMsg}</div>`;
  }
  h += `<div class="note" style="margin-top:10px"><b>會改什麼、不會改什麼</b>
    只置換頁面大小與邊界、預設字型字級行距這兩處設定，其餘每一個內部檔案都是原始位元組直接複製，
    所以圖片、圖說、表格、註腳、方程式、Zotero 或 EndNote 的欄位都不會受影響。
    檔案會另存為新檔，你的原稿不會被動到。存下來之後請在 Word 裡開一次確認。</div>`;
  h += `</div>`;

  // 未檢查的項目
  h += `<div class="rblock unchecked"><h4>本次沒有檢查的項目</h4>
    <ul>${unchecked.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <p>工具沒有報錯，不代表稿件沒有問題。</p></div>`;

  const links=[];
  if(j.system) links.push(`<a class="linkbtn" href="${esc(j.system)}" target="_blank" rel="noopener">投稿系統 <span class="ar">↗</span></a>`);
  if(j.site) links.push(`<a class="linkbtn" href="${esc(j.site)}" target="_blank" rel="noopener">期刊官網 <span class="ar">↗</span></a>`);
  h += `<div class="note" style="margin-top:4px"><b>最後一步還是要你自己做</b>　本站資料查證基準日為 2026-08-29，稿約會改版。
    送出前請對照該刊官網的現行稿約。${links.length?'<div class="linkrow" style="margin-top:9px">'+links.join('')+'</div>':''}</div>`;
  h += '</section>';
  return h;
}

/* ---------- 套用版面並下載 ---------- */
function wireFormat(root){
  const btn = root.querySelector('#fmtBtn');
  if(!btn) return;
  btn.onclick = async ()=>{
    const num = (id,d)=>{ const v=parseFloat((root.querySelector(id)||{}).value); return isFinite(v)?v:d; };
    const txt = (id,d)=>{ const v=((root.querySelector(id)||{}).value||'').trim(); return v||d; };
    const o = {
      top:num('#f-top',2.54), bottom:num('#f-bottom',2.54),
      left:num('#f-left',3.18), right:num('#f-right',3.18),
      zhFont:txt('#f-zh','新細明體'), enFont:txt('#f-en','Times New Roman'),
      size:num('#f-size',12), line:num('#f-line',240)
    };
    const doStrip = !!(root.querySelector('#o-strip')||{}).checked;
    const doLine  = !!(root.querySelector('#o-line')||{}).checked;
    St.busy = true; St.fmtMsg=''; A.render();
    try{
      const z = St.doc.zip;
      const dec = new TextDecoder();
      const docE = z.map.get('word/document.xml');
      let xml = await zipText(z, 'word/document.xml');
      const sp = patchSectPr(xml, o);
      xml = sp.xml;
      let stripped = 0, lineCleared = 0;
      if(doStrip){ const r = stripRunFonts(xml); xml = r.xml; stripped = r.removed; }
      if(doLine){ const r = stripParaSpacing(xml); xml = r.xml; lineCleared = r.removed; }
      docE.replaceWith = xml;

      const styE = z.map.get('word/styles.xml');
      if(styE) styE.replaceWith = patchDocDefaults(await zipText(z,'word/styles.xml'), o);

      const blob = await zipWrite(z.list);
      // 用完就清掉，免得再按一次時把已改過的內容當成原檔又改一遍
      z.list.forEach(e=>{ delete e.replaceWith; });

      const base = (St.src||'稿件.docx').replace(/\.docx$/i,'');
      const name = base + '_' + (A.J.find(x=>x.id===St.jid)||{}).name + '格式.docx';
      await saveFile(blob, name);

      const kb = (blob.size/1048576).toFixed(2);
      St.fmtMsg = '已產生 <b>'+esc(name)+'</b>（'+kb+' MB）。'+
        '共 '+St.doc.entryCount+' 個內部檔案，只置換了 2 個（版面與樣式），'+
        '其中 '+St.doc.mediaCount+' 張圖片是原始位元組直接複製。'+
        (stripped?'另清除了 '+stripped+' 處手動字型與字級設定。':'')+
        (lineCleared?'清除了 '+lineCleared+' 處段落行距設定。':'')+
        ' 請在 Word 裡開一次確認再送出。';
    }catch(err){
      St.fmtMsg = '';
      // 存檔被檢視者取消不算失敗，也不該把已產生的內容說成壞掉
      const code = err && err.code;
      St.err = SAVE_ERR[code] || ('產生失敗：' + ((err && err.message) || String(err)));
    }
    St.busy = false; A.render();
  };
}

A.registerView('lint', viewLint, '稿件檢查');
})();
</script>
